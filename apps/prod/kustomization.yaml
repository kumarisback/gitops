apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - ../base
  - app-secrets.yaml
  - jwt-signing-key.yaml
namespace: production

# order-service is deployed from charts/microservice; its tag is in
# order-service.values.yaml (docs/HELM.md).
#
# Every service runs the image Jenkins built from one app-repo commit: the
# tag is that commit's full SHA (app Jenkinsfiles), and ECR tags are
# immutable (tf shared-services), so a tag always means the same image.
# Never `latest`: a tag that moves can't be rolled back to, and ArgoCD
# doesn't see a new image behind an unchanged tag. The gitops Jenkins job
# bumps one service per pull request (kustomize edit set image); promote to
# staging and prod by copying a tag that has run in the environment before.
images:
  - name: 602367507570.dkr.ecr.us-east-1.amazonaws.com/frontend
    newTag: "6d9dfdcb454b4596b14a6cc09e19d9fa5ead7e35"
  - name: 602367507570.dkr.ecr.us-east-1.amazonaws.com/user-service
    newTag: "6d9dfdcb454b4596b14a6cc09e19d9fa5ead7e35"

# OpenTelemetry: shared agent settings come from ../components/otel-instrumentation.
# The agent sends every span (parentbased_always_on); which traces are kept
# is decided after the fact by the collector's tail sampler
# (addons/values/*/otel-collector-sampler.yaml): all errors, all requests
# over 500ms, and a share of the rest per environment.
components:
  - ../components/otel-instrumentation
  - ../components/request-logging
  - ../components/namespace-guardrails

configMapGenerator:
  - name: otel-environment
    literals:
      - DEPLOYMENT_ENVIRONMENT=production
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=production,k8s.namespace.name=production
      - OTEL_TRACES_SAMPLER=parentbased_always_on
  # Request payloads in the API log (see ../components/request-logging):
  # payloads of failed requests only: enough to debug a failure,
  # without storing customer data for every successful call.
  - name: request-logging
    literals:
      - APP_HTTP_LOGGING_REQUEST_BODY=ERRORS
