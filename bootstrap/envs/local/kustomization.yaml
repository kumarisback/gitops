apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local environment overlay for KinD: the local microservices plus the
# cluster add-ons (metrics-server, Prometheus/Grafana, Loki, Alloy, Tempo,
# OTel Collector) with the lab-sized values from addons/values/local.
resources:
  - local-apps.yaml
  - ../../../addons/applications

# Selects addons/values/local/ for every add-on (see addons/select-env).
configMapGenerator:
  - name: addons-env
    literals:
      - tier=local
      - env=local
    options:
      disableNameSuffixHash: true
      annotations:
        config.kubernetes.io/local-config: "true"

components:
  - ../../../addons/select-env
