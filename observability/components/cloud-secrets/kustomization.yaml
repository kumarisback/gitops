apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Secrets the cloud environments' monitoring stack reads, synced from AWS
# Secrets Manager by External Secrets Operator (ClusterSecretStore
# aws-secretsmanager in platform/). The including overlay generates a
# local-config ConfigMap observability-env with data.env, which replaces
# ENV in every key path (microservices/<env>/...), matching
# apps/<env>/app-secrets.yaml.
resources:
  - alertmanager-receivers.yaml
  - grafana-admin-credentials.yaml

replacements:
  - source:
      kind: ConfigMap
      name: observability-env
      fieldPath: data.env
    targets:
      - select:
          kind: ExternalSecret
        fieldPaths:
          - spec.data.*.remoteRef.key
        options:
          delimiter: /
          index: 1
