apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - ../base
  - resourcequota.yaml
  - limitrange.yaml

namespace: development

# OpenTelemetry: shared agent settings come from ../components/otel-instrumentation;
# the lab traces every request.
components:
  - ../components/otel-instrumentation

configMapGenerator:
  - name: otel-environment
    literals:
      - DEPLOYMENT_ENVIRONMENT=local
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=local,k8s.namespace.name=development
      - OTEL_TRACES_SAMPLER=always_on

# 100% Local: Do NOT pull from AWS ECR. Use images loaded directly into KinD.
patches:
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: order-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: user-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: user-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ORDER_SERVICE_URL
          value: http://order-service

  - target:
      kind: HorizontalPodAutoscaler
      name: frontend-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: order-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: user-service-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 1
  # Tracing on app-ingress. The controller-side exporter settings (collector
  # host, sampler) live in local-setup/ingress-nginx-otel.yaml.
  - target:
      kind: Ingress
      name: app-ingress
    patch: |-
      - op: replace
        path: /spec/ingressClassName
        value: nginx
      - op: add
        path: /metadata/annotations/nginx.ingress.kubernetes.io~1enable-opentelemetry
        value: "true"
      - op: add
        path: /metadata/annotations/nginx.ingress.kubernetes.io~1opentelemetry-trust-incoming-span
        value: "true"
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: order-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MANAGEMENT_ENDPOINT_HEALTH_VALIDATE_GROUP_MEMBERSHIP
          value: "false"
  - target:
      kind: Deployment
      name: user-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MANAGEMENT_ENDPOINT_HEALTH_VALIDATE_GROUP_MEMBERSHIP
          value: "false"
