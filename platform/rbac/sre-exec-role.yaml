# Namespace-scoped exec/port-forward, split out of the cluster-wide "sre"
# ClusterRole so debugging access doesn't extend to pods in other
# namespaces (kube-system, ArgoCD, ESO) that hold real credentials.
# Add one of these per namespace an SRE actually needs to exec into.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sre-exec
  namespace: development
rules:
- apiGroups: [""]
  resources: ["pods/exec", "pods/portforward"]
  verbs: ["create"]
