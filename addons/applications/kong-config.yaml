# Kong's cluster-wide configuration (platform/kong): the GatewayClass, the
# Gateway the services' routes attach to, and global plugins.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kong-config
  namespace: argocd
  labels:
    app.kubernetes.io/name: kong-config
    # Git-sourced: follows the root app's revision.
    app.kubernetes.io/part-of: gitops-config
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/kumarisback/gitops.git
    targetRevision: HEAD
    path: platform/kong
  destination:
    server: https://kubernetes.default.svc
    namespace: kong
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # The Gateway API and Kong CRDs come from the gateway-api and kong
    # applications; retry until they exist.
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
