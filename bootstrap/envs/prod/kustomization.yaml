apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Entry point for prod's ArgoCD root Application (see
# environments/app-cluster/prod.tfvars -> argocd_gitops_repo_path in the tf
# repo). Deploys only prod's app set plus the shared platform components —
# NOT dev/staging.
resources:
  - ../../projects/platform.yaml
  - ../../projects/prod.yaml
