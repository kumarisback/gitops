# The Kafka cluster "events" (roadmap step 12), run by the Strimzi operator
# (addons/streaming). This is the production shape; the lab overlay
# (streaming/local) shrinks it to one node.
#
# KRaft: Kafka keeps its own metadata in a quorum of controller nodes (no
# ZooKeeper). Three controllers survive the loss of one; three brokers with
# replication factor 3 and min.insync.replicas 2 survive the loss of one
# broker without losing acknowledged data or refusing writes.
#
# Zones: the VPCs (tf private_app_subnet_cidrs) span two availability zones,
# so pods spread 2+1. Losing the zone with two controllers loses the quorum
# and Kafka stops until it returns; acknowledged data survives (every write
# reached two replicas). Surviving a zone outage takes a third zone.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: controller
  labels:
    strimzi.io/cluster: events
spec:
  replicas: 3
  roles: [controller]
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 10Gi
        class: gp3
        kraftMetadata: shared
        # Keep the volume if the cluster is deleted by mistake.
        deleteClaim: false
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 1Gi
  jvmOptions:
    -Xms: 512m
    -Xmx: 512m
  template:
    pod:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              strimzi.io/pool-name: controller
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: broker
  labels:
    strimzi.io/cluster: events
spec:
  replicas: 3
  roles: [broker]
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 50Gi
        class: gp3
        deleteClaim: false
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      memory: 2Gi
  # Half the memory for the heap; Kafka relies on the rest as page cache.
  jvmOptions:
    -Xms: 1g
    -Xmx: 1g
  template:
    pod:
      # Spread over the zones: with rack awareness (spec.kafka.rack) each
      # partition's replicas are spread over the zones too, so no zone holds
      # all copies of anything.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              strimzi.io/pool-name: broker
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: events
spec:
  kafka:
    version: 4.3.1
    listeners:
      # Inside the cluster only, TLS only, and every client proves who it is
      # with a certificate (a KafkaUser, streaming/base/users.yaml). Clients
      # connect to events-kafka-bootstrap.kafka.svc:9093.
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: tls
    # Each user may do only what its ACLs (users.yaml) allow; kafka-admin
    # (for people, streaming/tools/kafka-admin.yaml) may do anything.
    authorization:
      type: simple
      superUsers:
        - CN=kafka-admin
    rack:
      topologyKey: topology.kubernetes.io/zone
    config:
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      # Topics exist only as KafkaTopic resources in Git (topics.yaml); a
      # typo in a client's topic name is an error, not a new topic.
      auto.create.topics.enable: false
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: kafka-metrics-config.yml
  entityOperator:
    # Topic and User Operators: turn the KafkaTopic and KafkaUser resources
    # in this namespace into topics, users, ACLs and client certificates.
    topicOperator: {}
    userOperator: {}
  # Consumer lag and per-partition offsets as Prometheus metrics.
  kafkaExporter:
    groupRegex: ".*"
    topicRegex: ".*"
