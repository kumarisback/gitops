apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: loki
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 6.6.2
    helm:
      values: |
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          # Required: chart 6.x refuses to render without a schema.
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: s3
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h

          # TODO: placeholder values — fill in the real bucket names and region
          # for each environment (dev/staging/prod) before this Application is
          # synced there. Until these are real, Loki will crash-loop on startup
          # and nothing will be ingested. ruler/admin may be the same bucket
          # as chunks; the chart renders all three into the config.
          storage:
            type: s3
            bucketNames:
              chunks: <your-loki-s3-bucket-name>
              ruler: <your-loki-s3-bucket-name>
              admin: <your-loki-s3-bucket-name>
            s3:
              region: <your-aws-region>
              s3ForcePathStyle: false

        # Use the pre-created ServiceAccount `loki` in the monitoring namespace,
        # annotated with eks.amazonaws.com/role-arn for S3 access (IRSA). This is
        # a top-level chart value; under `loki:` it was silently ignored and the
        # chart created its own unannotated ServiceAccount.
        serviceAccount:
          create: false
          name: loki

        # Run single binary/monolithic mode (matches bootstrap/envs/local/loki.yaml).
        # deploymentMode must be set explicitly — the chart otherwise defaults to
        # SimpleScalable and ignores the singleBinary tuning below.
        deploymentMode: SingleBinary
        singleBinary:
          replicas: 1
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1.5Gi
        gateway:
          enabled: false
        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true