# Where Secret unleash-db comes from on RDS: the master secret RDS keeps and
# rotates. Not through the cluster-wide store (platform/external-secrets.yaml),
# which any namespace's ExternalSecret may use, but through this store, which
# only ExternalSecrets in this namespace can name. External Secrets signs in
# to AWS as this ServiceAccount (a token it requests for it; nothing mounts
# one), and its IAM role may read that one secret only (tf 01-infra
# irsa_role_arns["unleash_rds_secret"]).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: unleash-db-reader
  namespace: feature-flags
  annotations:
    eks.amazonaws.com/role-arn: SECRET_READER_ROLE_ARN
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: rds-master-secret
  namespace: feature-flags
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: unleash-db-reader
