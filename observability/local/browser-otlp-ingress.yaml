# Browser spans: the frontend posts to /otlp/v1/traces on the page's own
# origin; Traefik forwards the path unchanged to the collector gateway's
# browser receiver (port 4319). Prefix /otlp outranks the app Ingress's "/".
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: browser-otlp
  namespace: monitoring
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /otlp
            pathType: Prefix
            backend:
              service:
                name: otel-collector-opentelemetry-collector
                port:
                  number: 4319
