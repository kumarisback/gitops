alloy:
  configMap:
    create: true
    # Same pipeline in every environment. The clustering block in
    # loki.source.kubernetes only takes effect where the tier file sets
    # alloy.clustering.enabled.
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "job"
        }
      }

      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.pod_logs.receiver]

        // With alloy.clustering.enabled the replicas shard the pods
        // between them so each is tailed once; without clustering
        // this block is a no-op and the one replica tails them all.
        clustering {
          enabled = true
        }
      }

      loki.process "pod_logs" {
        forward_to = [loki.write.default.receiver]

        // Mask credentials in every container's logs before they leave the
        // cluster: each capture group is replaced, the rest of the line is
        // kept. Query-string values stop at "&" or a backslash (JSON loggers
        // like Traefik write "&" as \u0026). Cases are tested in
        // tests/alloy/pipeline_cases.yaml.
        stage.replace {
          expression = "(?i)\\bbearer\\s+([a-z0-9\\-._~+/]+=*)"
          replace    = "<redacted>"
        }
        stage.replace {
          expression = "\\b(eyJ[A-Za-z0-9_-]{5,}\\.[A-Za-z0-9_-]{5,}\\.[A-Za-z0-9_-]{5,})"
          replace    = "<redacted-jwt>"
        }
        stage.replace {
          expression = "(?i)\"(?:password|passwd|secret|token|access_token|refresh_token|api_key|apikey|authorization)\"\\s*:\\s*\"([^\"]*)\""
          replace    = "<redacted>"
        }
        stage.replace {
          expression = "(?i)\\b(?:password|passwd|secret|token|access_token|api_key|apikey)=([^&\\s\"\\\\]+)"
          replace    = "<redacted>"
        }
        stage.replace {
          expression = "mongodb(?:\\+srv)?://([^:/\\s@]+:[^@/\\s]+)@"
          replace    = "<redacted>"
        }

        // Only the Spring services write one JSON object per line
        // (net.logstash.logback encoder), so only they get the
        // multiline rule: a new entry starts at "{" and anything else
        // (JVM or agent output that bypasses the encoder) joins the
        // previous entry. Applied cluster-wide it glued plain-text
        // logs from nginx, the ingress controller, Loki and ArgoCD into blocks
        // of up to 128 lines.
        stage.match {
          selector = "{container=~\"user-service|order-service\"}"

          stage.multiline {
            firstline     = "^\\{"
            max_wait_time = "3s"
          }
        }

        // Drop successful actuator calls (Kubernetes probes every 5-10s,
        // Prometheus scrapes every 15s): they outnumber real API calls and
        // say nothing. A failing probe or scrape (any status but 200) is
        // still kept as an API log.
        stage.match {
          selector            = "{container=~\"user-service|order-service\"} |= \"\\\"logger\\\":\\\"access.\" |= \"/actuator/\" |= \"\\\"http.status\\\":200,\""
          action              = "drop"
          drop_counter_reason = "actuator_ok"
        }

        // Label each Spring log line log_type="api" (the per-request
        // access log from RequestLoggingFilter, logger access.<svc>.http)
        // or log_type="server" (everything else) so Grafana can pick
        // one by label. Two values, so the index barely grows. No Go
        // templates in this file: the chart renders it through tpl. The
        // match stage's LogQL parser doesn't accept `raw` strings, hence
        // the escaped quotes.
        stage.match {
          selector = "{container=~\"user-service|order-service\"} |= \"\\\"logger\\\":\\\"access.\""

          stage.static_labels {
            values = { log_type = "api" }
          }
        }

        stage.match {
          selector = "{container=~\"user-service|order-service\"} != \"\\\"logger\\\":\\\"access.\""

          stage.static_labels {
            values = { log_type = "server" }
          }
        }

        // Loki tenant: application namespaces are "apps"; everything else
        // falls through to loki.write's tenant_id ("platform").
        stage.match {
          selector = "{namespace=~\"development|staging|production\"}"

          stage.tenant {
            value = "apps"
          }
        }
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
          // Tenant for everything not claimed by the "apps" match above.
          tenant_id = "platform"
        }
      }
controller:
  type: deployment
serviceMonitor:
  enabled: true
  additionalLabels:
    release: kube-prometheus-stack
