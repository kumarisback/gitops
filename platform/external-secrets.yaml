# Install External Secrets Operator using Helm through Kustomize or ArgoCD
# For simplicity, we define the ClusterSecretStore here.
# Make sure the ESO helm chart is installed by ArgoCD or Kustomize.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: kube-system
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rds-endpoint
  namespace: development
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: db-secret
  data:
  - secretKey: endpoint
    remoteRef:
      key: /dev/rds/endpoint
