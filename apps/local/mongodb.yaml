# Lab-only MongoDB, so the services work without Atlas, internet access or
# a secrets file. A StatefulSet (stable name mongodb-0, its own volume that
# survives restarts) behind a headless Service. No authentication: it is
# reachable only inside the KinD cluster. dev/staging/prod use their real
# database through apps/<env>/app-secrets.yaml.
#
# It runs as a replica set of one (rs0): order-service writes an order and
# its outbox event in one transaction (roadmap step 13), and MongoDB offers
# transactions only on replica sets (Atlas is one too). The Job at the end
# initiates the set on first start; MONGO_URI names it (replicaSet=rs0).
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  labels:
    app: mongodb
spec:
  clusterIP: None
  selector:
    app: mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0
          # Keep the WiredTiger cache inside the container's memory limit.
          args: ["--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
          ports:
            - name: mongodb
              containerPort: 27017
          # TCP checks: mongosh is a Node.js program that takes seconds to
          # start under this CPU limit, so an exec probe with it times out
          # and the kubelet keeps restarting a healthy database.
          readinessProbe:
            tcpSocket:
              port: mongodb
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mongodb
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: standard
        resources:
          requests:
            storage: 2Gi
---
# Its own identity, so the mesh policy below can name it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mongodb-init
automountServiceAccountToken: false
---
# Makes mongodb-0 the primary of replica set rs0, once. Safe to run again:
# it does nothing when the set already exists.
apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-replica-set-init
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: mongodb-init
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: init
          image: mongo:7.0
          command:
            - mongosh
            - --quiet
            - --host
            - mongodb-0.mongodb
            - --eval
            - |
              try {
                rs.status();
                print("replica set rs0 already initiated");
              } catch (e) {
                if (e.codeName !== "NotYetInitialized") { throw e; }
                rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongodb-0.mongodb.development.svc.cluster.local:27017"}]});
                print("replica set rs0 initiated");
              }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
---
# In the service mesh (roadmap step 18, docs/MESH.md): only the services
# that use the database, and the Job above, may connect to it.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: mongodb-connections
spec:
  selector:
    matchLabels:
      app: mongodb
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/development/sa/user-service
              - cluster.local/ns/development/sa/order-service
              - cluster.local/ns/development/sa/mongodb-init
              # The migrations Job (roadmap step 24).
              - cluster.local/ns/development/sa/user-service-migrations
---
# NetworkPolicies (roadmap step 19, apps/base/network-policies.yaml): the
# database takes connections only from its clients, through the mesh
# (15008), and the kubelet's checks on its own port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongodb
spec:
  podSelector:
    matchLabels:
      app: mongodb
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [user-service, order-service, user-service-migrations]
        # The init Job's pod, by the label Kubernetes gives every Job's pods.
        - podSelector:
            matchLabels:
              batch.kubernetes.io/job-name: mongodb-replica-set-init
      ports:
        - port: 15008
          protocol: TCP
    - from:
        - ipBlock:
            cidr: 169.254.7.127/32
      ports:
        - port: mongodb
          protocol: TCP
---
# ...and the clients may connect to it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongodb-clients
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [user-service, order-service, user-service-migrations]
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: mongodb
      ports:
        - port: 15008
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongodb-replica-set-init
spec:
  podSelector:
    matchLabels:
      batch.kubernetes.io/job-name: mongodb-replica-set-init
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: mongodb
      ports:
        - port: 15008
          protocol: TCP
