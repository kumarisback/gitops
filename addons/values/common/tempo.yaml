tempo:
  reportingEnabled: false
  retention: 24h
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
persistence:
  enabled: true
replicas: 1
# Scraped by Prometheus for the pipeline alerts in
# observability/base/pipeline-alerts.yaml.
serviceMonitor:
  enabled: true
  additionalLabels:
    release: kube-prometheus-stack
