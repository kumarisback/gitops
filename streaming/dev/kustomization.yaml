apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# dev runs the production shape (streaming/base): three controllers, three
# brokers on gp3. Plus the events archive to S3.
namespace: kafka

resources:
  - ../base

# Needs tf 01-infra with enable_events_archive = true (dev.tfvars): the
# bucket and the role below.
components:
  - ../components/events-archive

patches:
  # The image: app repo kafka-connect/, tagged with the commit it was built
  # from. The role: tf output irsa_role_arns["kafka_connect"].
  - patch: |-
      apiVersion: kafka.strimzi.io/v1
      kind: KafkaConnect
      metadata:
        name: events-connect
      spec:
        image: 602367507570.dkr.ecr.us-east-1.amazonaws.com/kafka-connect:5859301cb5af1c764790573bc55261e472a83f90
        template:
          serviceAccount:
            metadata:
              annotations:
                eks.amazonaws.com/role-arn: arn:aws:iam::602367507570:role/microservices-dev-irsa-kafka_connect
  # tf output events_archive_bucket_name.
  - patch: |-
      apiVersion: kafka.strimzi.io/v1
      kind: KafkaConnector
      metadata:
        name: events-archive
      spec:
        config:
          aws.s3.bucket.name: microservices-dev-events-archive-602367507570
