apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Backups of the cluster itself (roadmap step 25, docs/BACKUP-DR.md): Velero,
# and backup/<env> (in the lab, the object store Velero writes to). The lab
# and dev run it; an environment opts in with one line in
# bootstrap/envs/<env>:
#
#   - ../../../addons/backup
#
# plus tf 01-infra enable_velero (the bucket and role) and
# addons/values/<env>/velero.yaml (their names).
resources:
  - velero.yaml
  - backup-config.yaml
