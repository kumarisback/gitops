suite: deployment
templates:
  - templates/deployment.yaml
release:
  name: order-service
  namespace: development
set:
  image.tag: 6d9dfdcb454b4596b14a6cc09e19d9fa5ead7e35
  openTelemetry.environment: dev
tests:
  - it: is named after the release and selects pods by app only
    asserts:
      - equal:
          path: metadata.name
          value: order-service
      - equal:
          path: spec.selector.matchLabels
          value:
            app: order-service
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: order-service
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/version"]
          value: 6d9dfdcb454b4596b14a6cc09e19d9fa5ead7e35

  - it: sets no replica count while the HPA owns it
    asserts:
      - notExists:
          path: spec.replicas

  - it: sets the replica count when autoscaling is off
    set:
      autoscaling.enabled: false
      replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: runs the pinned image
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: 602367507570.dkr.ecr.us-east-1.amazonaws.com/order-service:6d9dfdcb454b4596b14a6cc09e19d9fa5ead7e35

  - it: puts the probes under the context path
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /api/orders/actuator/health/readiness
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /api/orders/actuator/health/liveness
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /api/orders/actuator/health/liveness

  - it: runs as a non-root user with a read-only root filesystem
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value: ["ALL"]
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: configures the OpenTelemetry agent for its environment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_RESOURCE_ATTRIBUTES
            value: deployment.environment=dev,k8s.namespace.name=development
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_SERVICE_NAME
            value: order-service
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEPLOYMENT_ENVIRONMENT
            value: dev

  - it: leaves the agent unconfigured when OpenTelemetry is off
    set:
      openTelemetry.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_TRACES_EXPORTER
            value: otlp

  - it: passes the payload logging level and extra variables through
    set:
      requestLogging.requestBody: ERRORS
      extraEnv:
        - name: FEATURE_X
          value: "on"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: APP_HTTP_LOGGING_REQUEST_BODY
            value: ERRORS
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FEATURE_X
            value: "on"

  - it: refuses to render without an image tag
    set:
      image.tag: ""
    asserts:
      - failedTemplate: {}

  - it: refuses an unknown environment name
    set:
      openTelemetry.environment: prd
    asserts:
      - failedTemplate: {}

  - it: leaves out MongoDB for a service without a database
    set:
      mongodbUriSecret: null
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SPRING_DATA_MONGODB_URI
          any: true

  - it: connects to Kafka from the KafkaAccess Secret when kafka is enabled
    set:
      kafka.enabled: true
      kafka.accessSecret: order-service-kafka
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: APP_EVENTS_ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SPRING_KAFKA_SSL_BUNDLE
            value: kafka
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SPRING_SSL_BUNDLE_PEM_KAFKA_KEYSTORE_PRIVATEKEY
            valueFrom:
              secretKeyRef:
                name: order-service-kafka
                key: ssl.keystore.key
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SPRING_KAFKA_BOOTSTRAP_SERVERS
            valueFrom:
              secretKeyRef:
                name: order-service-kafka
                key: bootstrap.servers

  - it: has no Kafka settings by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SPRING_KAFKA_SSL_BUNDLE
          any: true

  - it: refuses kafka.enabled without the Secret's name
    set:
      kafka.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "kafka.accessSecret is required when kafka.enabled"
