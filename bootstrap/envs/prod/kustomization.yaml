apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Entry point for prod's ArgoCD root Application (see
# environments/app-cluster/prod.tfvars -> argocd_gitops_repo_path in the tf
# repo). Deploys only prod's app set plus the shared platform components —
# NOT dev/staging.
#
# TODO before prod is actually turned on: add aws-lb-controller-prod.yaml and
# external-secrets-operator-prod.yaml (copy the -dev.yaml versions, update
# clusterName to microservices-prod-eks-cluster) and list them here — see
# bootstrap/envs/dev/kustomization.yaml for the pattern.
resources:
  - ../../projects/platform.yaml
  - ../../projects/prod.yaml
  - ../../projects/order-service-prod.yaml
  # Cluster add-ons: metrics-server, logs (Loki/Alloy), metrics
  # (kube-prometheus-stack) and traces (Tempo/OTel Collector).
  - ../../../addons/applications

# Selects addons/values/cloud/ and addons/values/prod/ for every add-on
# (see addons/select-env).
configMapGenerator:
  - name: addons-env
    literals:
      - tier=cloud
      - env=prod
    options:
      disableNameSuffixHash: true
      annotations:
        config.kubernetes.io/local-config: "true"

components:
  - ../../../addons/select-env
