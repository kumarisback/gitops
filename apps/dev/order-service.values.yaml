# order-service in dev, deployed with charts/microservice (docs/HELM.md)
# instead of Kustomize. Only what differs from the chart's defaults
# (charts/microservice/values.yaml).
image:
  # The full commit SHA Jenkins tagged the image with; the gitops Jenkins job
  # bumps it by pull request, like the other services' tags in
  # kustomization.yaml.
  tag: "6d9dfdcb454b4596b14a6cc09e19d9fa5ead7e35"
openTelemetry:
  environment: dev
# Request payloads in the API log: shared dev: see every payload while testing.
requestLogging:
  requestBody: ALWAYS
# Publishes OrderCreated events to Kafka (roadmap step 12) with the
# connection from the order-service-kafka KafkaAccess Secret
# (apps/components/kafka-clients).
kafka:
  enabled: true
  accessSecret: order-service-kafka
# KEDA (roadmap step 15, docs/KEDA.md) on two signals, whichever asks for
# more replicas: requests per second per replica (Prometheus; 20 is a
# starting point until step 40's load tests measure what a replica
# handles) and CPU as before. Never to zero: an API must answer at once.
# staging and prod keep the plain CPU autoscaler, to compare.
autoscaling:
  minReplicas: 2
  maxReplicas: 10
  keda:
    enabled: true
    triggers:
      - type: prometheus
        metadata:
          serverAddress: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
          query: sum(rate(http_server_requests_seconds_count{namespace="development", job="order-service", uri!~".*actuator.*"}[2m]))
          threshold: "20"
      - type: cpu
        metricType: Utilization
        metadata:
          value: "70"
