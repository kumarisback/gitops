apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-apps
  namespace: argocd
  # Git-sourced: follows the root app's revision (see bootstrap/root-app-local.yaml
  # and the tf repo's root app).
  labels:
    app.kubernetes.io/part-of: gitops-config
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/kumarisback/gitops.git
    # Overridden by root-app-local to match its own revision.
    targetRevision: HEAD
    path: apps/local
  destination:
    server: https://kubernetes.default.svc
    namespace: development
  syncPolicy:
    # The app-secrets Secret is created outside Git (start-lab.sh), so ArgoCD
    # never tracks it and prune can't delete it.
    automated:
      prune: true
      selfHeal: true
