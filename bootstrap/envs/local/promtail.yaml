apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: promtail
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: promtail
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 6.15.5
    helm:
      values: |
        config:
          clients:
            - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
          snippets:
            pipelineStages:
              - cri: {}
              # Logs are single-line JSON (net.logstash.logback encoder writing to
              # stdout), so a new entry starts at "{" and any line that doesn't
              # start with "{" (e.g. a JVM/Spring Boot startup message that bypasses
              # the JSON encoder) is joined onto the previous entry instead of being
              # shipped as its own broken log line.
              - multiline:
                  firstline: '^\{'
                  max_wait_time: 3s
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true