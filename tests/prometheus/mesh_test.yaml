# Unit tests for observability/base/mesh-alerts.yaml (validate.sh extracts
# the rule file first; see slo_test.yaml).
rule_files:
  - ../../.validate/rules/observability/mesh-alerts.yaml

evaluation_interval: 30s

tests:
  # ztunnel can't start on one node from 2m (a bad upgrade).
  - interval: 1m
    input_series:
      - series: 'kube_daemonset_status_number_unavailable{namespace="istio-system",daemonset="ztunnel",job="kube-state-metrics"}'
        values: '0 0 1x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: ZtunnelUnavailable
        exp_alerts: []
      - eval_time: 8m
        alertname: ZtunnelUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: istio-system
              daemonset: ztunnel
            exp_annotations:
              summary: "ztunnel is missing on 1 nodes"
              description: "Meshed pods on those nodes can neither send nor receive traffic until it is back."
              runbook_url: https://github.com/kumarisback/gitops/blob/main/docs/runbooks.md#ztunnelunavailable

  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="development",deployment="waypoint",job="kube-state-metrics"}'
        values: '2 2 0x10'
      - series: 'kube_deployment_spec_replicas{namespace="development",deployment="waypoint",job="kube-state-metrics"}'
        values: '2x12'
    alert_rule_test:
      - eval_time: 5m
        alertname: WaypointUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: development
              deployment: waypoint
            exp_annotations:
              summary: "The mesh waypoint of development has no ready pod"
              description: "Requests to every Service in development fail: from Kong, between the services and from the synthetic checks."
              runbook_url: https://github.com/kumarisback/gitops/blob/main/docs/runbooks.md#waypointunavailable

  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="istio-system",deployment="istiod",job="kube-state-metrics"}'
        values: '1 0x10'
      - series: 'kube_deployment_spec_replicas{namespace="istio-system",deployment="istiod",job="kube-state-metrics"}'
        values: '1x11'
    alert_rule_test:
      - eval_time: 7m
        alertname: IstiodUnavailable
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: istio-system
              deployment: istiod
            exp_annotations:
              summary: "Istio's control plane (istiod) has no ready pod"
              description: "New pods get no mesh identity and policy changes don't apply. Existing traffic continues until workload certificates expire, within a day."
              runbook_url: https://github.com/kumarisback/gitops/blob/main/docs/runbooks.md#istiodunavailable
