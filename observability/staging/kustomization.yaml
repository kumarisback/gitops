apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

components:
  - ../components/cloud-secrets
  - ../components/browser-otlp-alb

# Picks microservices/staging/... in AWS Secrets Manager (not deployed).
configMapGenerator:
  - name: observability-env
    literals:
      - env=staging
    options:
      disableNameSuffixHash: true
      annotations:
        config.kubernetes.io/local-config: "true"
