# Cluster-scoped store shared by every environment's ExternalSecret. Each
# environment defines its own app-specific ExternalSecret under
# apps/<env>/app-secrets.yaml instead of embedding them here.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: kube-system
