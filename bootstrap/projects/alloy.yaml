apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy-logs
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: alloy
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 1.11.1
    helm:
      # Same pipeline as bootstrap/envs/local/alloy.yaml, plus clustering:
      # two replicas share the pod targets so each pod is tailed exactly
      # once and log shipping survives one replica going down.
      values: |
        alloy:
          clustering:
            enabled: true
          configMap:
            create: true
            content: |
              discovery.kubernetes "pods" {
                role = "pod"
              }

              discovery.relabel "pod_logs" {
                targets = discovery.kubernetes.pods.targets

                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }

                rule {
                  source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
                  separator     = "/"
                  target_label  = "job"
                }
              }

              loki.source.kubernetes "pod_logs" {
                targets    = discovery.relabel.pod_logs.output
                forward_to = [loki.process.pod_logs.receiver]

                // Without this every replica would tail every pod.
                clustering {
                  enabled = true
                }
              }

              loki.process "pod_logs" {
                forward_to = [loki.write.default.receiver]

                // Only the Spring services write one JSON object per line, so
                // only they get the multiline rule (see the local file).
                stage.match {
                  selector = "{container=~\"user-service|order-service\"}"

                  stage.multiline {
                    firstline     = "^\\{"
                    max_wait_time = "3s"
                  }
                }
              }

              loki.write "default" {
                endpoint {
                  url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
                }
              }
        controller:
          type: deployment
          replicas: 2
        serviceMonitor:
          enabled: true
          additionalLabels:
            release: kube-prometheus-stack
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
