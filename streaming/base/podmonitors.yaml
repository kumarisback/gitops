# What Prometheus scrapes in the kafka namespace, from Strimzi 1.3.0's
# examples (packaging/examples/metrics/prometheus-install/pod-monitors). The
# relabelling into strimzi_io_* and kubernetes_pod_name labels is what the
# Strimzi dashboards and kafka-alerts.yaml group by; keep it when upgrading.
# No namespaceSelector: a PodMonitor watches its own namespace.

# Brokers, controllers (JMX metrics, kafka-metrics.yaml) and the Kafka
# Exporter (consumer lag, partition offsets).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kafka-resources-metrics
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchExpressions:
      - key: strimzi.io/kind
        operator: In
        values: [Kafka, KafkaConnect, KafkaMirrorMaker2]
  podMetricsEndpoints:
    - path: /metrics
      port: tcp-prometheus
      relabelings:
        - regex: __meta_kubernetes_pod_label_(strimzi_io_.+)
          replacement: $1
          action: labelmap
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: kubernetes_pod_name
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node_name
        - sourceLabels: [__meta_kubernetes_pod_host_ip]
          targetLabel: node_ip
---
# The Topic and User Operators (reconciliations, failures).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: entity-operator-metrics
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: entity-operator
  podMetricsEndpoints:
    - path: /metrics
      port: healthcheck-to
    - path: /metrics
      port: healthcheck-uo
---
# The Cluster Operator (addons/streaming), and the certificate expiry times
# it reports (KafkaCertificateExpiringSoon).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cluster-operator-metrics
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      strimzi.io/kind: cluster-operator
  podMetricsEndpoints:
    - path: /metrics
      port: http
