apiVersion: apps/v1
kind: Deployment

metadata:
  name: user-service
  namespace: production

spec:
  replicas: 2

  selector:
    matchLabels:
      app: user-service

  template:
    metadata:
      labels:
        app: user-service

    spec:
      serviceAccountName: user-service
      # Same caveat as order-service: the app doesn't set
      # server.shutdown=graceful yet, so this is only the k8s-side half of
      # graceful shutdown.
      terminationGracePeriodSeconds: 30

      securityContext:
        # Dockerfile pins USER 1000:1000 explicitly (was a name-based
        # "spring" user before, which kubelet can't statically verify as
        # non-root without this).
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000

      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: user-service

      containers:
      - name: user-service
        image: 602367507570.dkr.ecr.us-east-1.amazonaws.com/user-service:latest

        env:

        # Legacy MySQL environment variables commented out while migrating to MongoDB
        # - name: DB_HOST
        #   valueFrom:
        #     secretKeyRef:
        #       name: app-secrets
        #       key: DB_HOST

        # - name: SPRING_DATASOURCE_USERNAME
        #   valueFrom:
        #     secretKeyRef:
        #       name: app-secrets
        #       key: DB_USERNAME

        # - name: SPRING_DATASOURCE_PASSWORD
        #   valueFrom:
        #     secretKeyRef:
        #       name: app-secrets
        #       key: DB_PASSWORD

        - name: SPRING_DATA_MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: MONGO_URI
# Legacy secret key kept for reference:
#              key: DATABASE_URL

        ports:
        - containerPort: 8080

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]

        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 5"]

        # server.servlet.context-path=/api (application.properties) —
        # actuator's base path nests under it when sharing the app's port.
        # Uses the liveness group, not the full aggregate health, so a Mongo
        # outage at boot can't restart-loop a pod that's otherwise fine —
        # same reasoning as livenessProbe below, just for the startup gate.
        startupProbe:
          httpGet:
            path: /api/actuator/health/liveness
            port: 8080
          periodSeconds: 5
          failureThreshold: 24

        readinessProbe:
          httpGet:
            path: /api/actuator/health/readiness
            port: 8080
          periodSeconds: 5
          failureThreshold: 3

        livenessProbe:
          httpGet:
            path: /api/actuator/health/liveness
            port: 8080
          periodSeconds: 10
          failureThreshold: 3

        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi

        volumeMounts:
        - name: tmp
          mountPath: /tmp

      volumes:
      - name: tmp
        emptyDir: {}
