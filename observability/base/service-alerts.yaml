# Basic availability of the backend services, in every environment.
# Request-level health (errors, latency) is covered by the SLO burn-rate
# alerts in slo-rules.yaml; pod-level problems by kube-prometheus-stack's
# default rules (KubePodCrashLooping, KubeDeploymentReplicasMismatch, ...).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: service-alerts
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: service-availability
      rules:
        # Every pod of a service gone or unready, so every request to it
        # fails. ServiceDown can't see this: with no pod there's no scrape
        # target and no `up` series to be 0. The SLO alerts can't either:
        # the services' own request metrics disappear with their pods. So
        # it's read from the Deployment (kube-state-metrics). job is set to
        # the deployment so Alertmanager can inhibit the alerts it implies.
        # Only while pods are wanted: KEDA scales notification-service to
        # zero on purpose when Kafka is drained (roadmap step 15).
        - alert: ServiceUnavailable
          expr: |
            label_replace(
              (
                max by (namespace, deployment) (
                  kube_deployment_status_replicas_available{deployment=~"frontend|order-service|user-service|notification-service"}
                ) == 0
              )
              and on (namespace, deployment)
              (
                max by (namespace, deployment) (
                  kube_deployment_spec_replicas{deployment=~"frontend|order-service|user-service|notification-service"}
                ) > 0
              ),
              "job", "$1", "deployment", "(.+)"
            )
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.deployment }} has no ready pods in {{ $labels.namespace }}"
            description: "No pod of {{ $labels.deployment }} has been ready for 2 minutes although some are wanted: requests to it fail, or for a consumer (notification-service) its Kafka backlog grows."
            runbook_url: https://github.com/kumarisback/gitops/blob/main/docs/runbooks.md#serviceunavailable
        - alert: ServiceDown
          expr: up{job=~"order-service|user-service|notification-service"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.job }} is not answering scrapes in {{ $labels.namespace }}"
            description: "Prometheus has failed to scrape {{ $labels.pod }} for 2 minutes; the pod is down, not ready, or /actuator/prometheus is failing."
            runbook_url: https://github.com/kumarisback/gitops/blob/main/docs/runbooks.md#servicedown
        # One absent_over_time per service: with a regex matcher it only
        # returns a result when *no* matching series exist.
        - alert: ServiceMetricsMissing
          expr: |
            absent_over_time(up{job="order-service"}[10m])
            or
            absent_over_time(up{job="user-service"}[10m])
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.job }} has no scrape target at all"
            description: "Prometheus has had no target for {{ $labels.job }} for 10 minutes: the Service, its labels or the ServiceMonitor is missing."
            runbook_url: https://github.com/kumarisback/gitops/blob/main/docs/runbooks.md#servicemetricsmissing
