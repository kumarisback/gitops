{{- $name := include "microservice.name" . -}}
{{- /*
A Deployment, or with rollout.enabled an Argo Rollout (roadmap step 20,
docs/ROLLOUTS.md): the same pods, released as a canary that is measured
and rolled back on its own if it misbehaves.
*/}}
apiVersion: {{ include "microservice.workloadApiVersion" . }}
kind: {{ include "microservice.workloadKind" . }}
metadata:
  name: {{ $name }}
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
  {{- if .Values.rollout.enabled }}
  annotations:
    # The kind exists once the argo-rollouts add-on has installed its CRDs;
    # until then ArgoCD skips the dry run for this object.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "microservice.selectorLabels" . | nindent 6 }}
  {{- with .Values.rollout }}
  {{- if .enabled }}
  progressDeadlineSeconds: {{ .progressDeadlineSeconds }}
  # A canary that doesn't become ready in time is rolled back, not left
  # half-released.
  progressDeadlineAbort: true
  strategy:
    canary:
      # Argo Rollouts points each Service at its version's pods.
      stableService: {{ $name }}
      canaryService: {{ $name }}-canary
      {{- with .virtualService }}
      # It sets the two destinations' weights in this VirtualService.
      trafficRouting:
        istio:
          virtualService:
            name: {{ . }}
            routes: [primary]
      {{- end }}
      {{- if .analysis.enabled }}
      # From the first pause to the end (analysistemplate.yaml).
      analysis:
        templates:
          - templateName: {{ $name }}-canary
        startingStep: 1
        args:
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
      {{- end }}
      steps:
        {{- toYaml .steps | nindent 8 }}
  {{- end }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "microservice.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "microservice.selectorLabels" . | nindent 14 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required: the image's commit SHA" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
            - name: management
              containerPort: {{ .Values.managementPort }}
          env:
            {{- with .Values.mongodbUriSecret }}
            - name: SPRING_DATA_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- end }}
            - name: APP_HTTP_LOGGING_REQUEST_BODY
              value: {{ .Values.requestLogging.requestBody | quote }}
            - name: DEPLOYMENT_ENVIRONMENT
              value: {{ required "openTelemetry.environment is required" .Values.openTelemetry.environment | quote }}
            {{- if .Values.openTelemetry.enabled }}
            - name: OTEL_SERVICE_NAME
              value: {{ $name }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.openTelemetry.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
            - name: OTEL_PROPAGATORS
              value: tracecontext,baggage
            - name: OTEL_TRACES_SAMPLER
              value: {{ .Values.openTelemetry.sampler | quote }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment={{ .Values.openTelemetry.environment }},k8s.namespace.name={{ .Release.Namespace }}"
            {{- end }}
            {{- if .Values.kafka.enabled }}
            {{- include "microservice.kafkaEnv" . | nindent 12 }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep {{ .Values.preStopSleepSeconds }}"]
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: management
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: management
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: management
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem moves the JVM's temp files to an emptyDir.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
