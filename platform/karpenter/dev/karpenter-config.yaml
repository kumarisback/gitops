# dev's Karpenter capacity: what kind of nodes it may launch (NodePool) and
# how to launch them in AWS (EC2NodeClass). Karpenter v1 API, chart
# version in bootstrap/projects/karpenter-dev.yaml.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"] # Spot first, falls back to on-demand
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r", "t"] # Standard compute/memory instance classes
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      # Replace every node after 30 days, so nodes pick up new AMIs and
      # don't drift for months.
      expireAfter: 720h
  limits:
    cpu: 100 # Maximum cumulative CPUs this Karpenter pool is allowed to provision
  disruption:
    # Remove empty nodes and repack under-used ones onto fewer nodes,
    # respecting PodDisruptionBudgets; wait a minute after the last pod
    # change so a short dip doesn't churn nodes.
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  # Amazon Linux 2023, pinned to one EKS AMI release (awslabs/amazon-eks-ami
  # v20260930, which covers Kubernetes 1.36). EKS publishes no Amazon Linux
  # 2 AMIs after Kubernetes 1.32. Bump the date to roll nodes onto a newer
  # AMI: Karpenter replaces them gradually, within disruption budgets.
  amiSelectorTerms:
    - alias: al2023@v20260930
  # Created by the tf repo (01-infra, aws_iam_instance_profile.karpenter)
  # for the node role. Naming the profile rather than the role means the
  # controller needs no IAM write access.
  instanceProfile: microservices-dev-karpenter-instance-profile
  # Tagged by the tf repo: the private app subnets, and the security group
  # EKS created for the cluster (the managed node group's nodes use it too,
  # so all nodes can reach each other's pods).
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: microservices-dev-eks-cluster
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: microservices-dev-eks-cluster
