# Two replicas, so a node drain or a Karpenter consolidation doesn't pause
# every probe at once (a paused probe can't fire EndpointDown).
replicas: 2
podDisruptionBudget:
  minAvailable: 1
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: prometheus-blackbox-exporter
        app.kubernetes.io/instance: blackbox-exporter
