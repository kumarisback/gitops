apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: kube-prometheus-stack
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 61.3.0
    helm:
      values: |
        prometheus:
          prometheusSpec:
            # Instructs Prometheus to look for ServiceMonitors across all namespaces
            serviceMonitorSelectorNilUsesHelmValues: false
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: 1000m
                memory: 2Gi
        grafana:
          # No hardcoded default password: this environment's Grafana reads its
          # admin credentials from a pre-existing Secret in the monitoring
          # namespace instead. Until this is wired through ExternalSecrets
          # (matching the apps/<env>/app-secrets.yaml pattern), create it once
          # per cluster out-of-band, e.g.:
          #   kubectl create secret generic grafana-admin-credentials \
          #     -n monitoring \
          #     --from-literal=admin-user=admin \
          #     --from-literal=admin-password='<a real generated password>'
          # Grafana will fail to start until this Secret exists.
          admin:
            existingSecret: grafana-admin-credentials
            userKey: admin-user
            passwordKey: admin-password
          additionalDataSources:
            - name: Loki
              type: loki
              uid: Loki
              access: proxy
              url: http://loki.monitoring.svc.cluster.local:3100
              isDefault: false
            - name: Tempo
              type: tempo
              uid: Tempo
              access: proxy
              url: http://tempo.monitoring.svc.cluster.local:3200
              isDefault: false
          persistence:
            enabled: true
            storageClassName: "gp3"
            size: 10Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true