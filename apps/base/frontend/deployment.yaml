apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: production

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      serviceAccountName: frontend

      containers:
      - name: frontend

        image: 602367507570.dkr.ecr.us-east-1.amazonaws.com/frontend:latest

        ports:
        - containerPort: 80

        resources:
          requests:
            cpu: 100m
            memory: 256Mi

          limits:
            cpu: 250m
            memory: 512Mi
