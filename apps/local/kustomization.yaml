apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - ../base
  - resourcequota.yaml
  - limitrange.yaml
  # Lab-only database (see mongodb.yaml).
  - mongodb.yaml

namespace: development

# OpenTelemetry: shared agent settings come from ../components/otel-instrumentation.
# The agent sends every span (parentbased_always_on); which traces are kept
# is decided after the fact by the collector's tail sampler
# (addons/values/*/otel-collector-sampler.yaml): all errors, all requests
# over 500ms, and a share of the rest per environment.
components:
  - ../components/otel-instrumentation

configMapGenerator:
  - name: otel-environment
    literals:
      - DEPLOYMENT_ENVIRONMENT=local
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=local,k8s.namespace.name=development
      - OTEL_TRACES_SAMPLER=parentbased_always_on

# 100% Local: Do NOT pull from AWS ECR. Use images loaded directly into KinD.
patches:
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: order-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: user-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: user-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ORDER_SERVICE_URL
          value: http://order-service

  - target:
      kind: HorizontalPodAutoscaler
      name: frontend-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: order-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: user-service-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 1
  # Local ingress controller: Traefik (scripts/start-lab.sh). It traces
  # every request on its own (local-setup/traefik-values.yaml), so the
  # Ingress needs no per-object tracing annotations.
  - target:
      kind: Ingress
      name: app-ingress
    patch: |-
      - op: replace
        path: /spec/ingressClassName
        value: traefik
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: order-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MANAGEMENT_ENDPOINT_HEALTH_VALIDATE_GROUP_MEMBERSHIP
          value: "false"
  - target:
      kind: Deployment
      name: user-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MANAGEMENT_ENDPOINT_HEALTH_VALIDATE_GROUP_MEMBERSHIP
          value: "false"
