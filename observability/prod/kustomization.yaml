apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

components:
  - ../components/cloud-secrets
  - ../components/browser-otlp-alb
  - ../components/synthetic-probes

# env picks microservices/prod/... in AWS Secrets Manager; app_namespace is
# where the synthetic probes find the services (not deployed).
configMapGenerator:
  - name: observability-env
    literals:
      - env=prod
      - app_namespace=production
    options:
      disableNameSuffixHash: true
      annotations:
        config.kubernetes.io/local-config: "true"
