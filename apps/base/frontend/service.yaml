apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: production
  labels:
    app: frontend
  # Kong sends requests to the Service's address, not straight to a pod,
  # so they pass the mesh's waypoint and its policies (docs/MESH.md).
  annotations:
    ingress.kubernetes.io/service-upstream: "true"
spec:
  # ClusterIP, not LoadBalancer: the single public entrypoint is the edge
  # (ALB, or Traefik in the lab) in front of Kong, which routes / here and
  # /api to the backends (routes.yaml). A LoadBalancer of its own would give
  # the frontend an entrance with no path routing, so a same-origin
  # `/api/...` fetch from the browser would never reach a backend.
  type: ClusterIP
  selector:
    app: frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
---
# The next version during a blue/green release (rollout.yaml): Argo Rollouts
# points it at the new pods while Service frontend keeps the current ones.
# Nothing routes here; look at it with
#   kubectl port-forward -n <namespace> svc/frontend-preview 8080:80
apiVersion: v1
kind: Service
metadata:
  name: frontend-preview
  namespace: production
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: preview
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
