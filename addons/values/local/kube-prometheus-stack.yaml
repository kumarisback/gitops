prometheus:
  prometheusSpec:
    retention: 24h
    retentionSize: 4GB
grafana:
  # Lab only: a throwaway cluster on localhost.
  adminPassword: "admin"
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
  persistence:
    storageClassName: "standard"
    size: 2Gi
alertmanager:
  # Lab: alerts show in the Alertmanager UI
  # (kubectl port-forward svc/kube-prometheus-stack-alertmanager 9093 -n monitoring)
  # and Grafana, and are sent nowhere.
  config:
    route:
      receiver: "null"
      group_by: [alertname, namespace, job]
      routes: []
    receivers:
      - name: "null"
