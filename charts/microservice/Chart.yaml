apiVersion: v2
name: microservice
description: >-
  One Spring Boot service of this project: Deployment, Service,
  ServiceAccount, HorizontalPodAutoscaler, PodDisruptionBudget,
  VerticalPodAutoscaler (recommendations only) and ServiceMonitor, each one
  switchable in values. The same hardening as the Kustomize-deployed
  services: probes, non-root and read-only root filesystem, graceful
  shutdown, zone spreading.
type: application
# The chart's own version: bump it with every change here (scripts/publish-chart.sh
# refuses to publish changed contents under an existing version). The image a
# release runs is image.tag in its values, not this.
version: 0.1.0
dependencies:
  - name: common
    version: 0.1.0
    repository: file://../common
