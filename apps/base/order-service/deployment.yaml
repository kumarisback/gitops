apiVersion: apps/v1
kind: Deployment

metadata:
  name: order-service
  namespace: production

spec:
  replicas: 2

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      serviceAccountName: order-service

      containers:
      - name: order-service

        image: 602367507570.dkr.ecr.us-east-1.amazonaws.com/order-service:latest

        env:

        # Legacy MySQL environment variables commented out while migrating to MongoDB
        # - name: DB_HOST
        #   valueFrom:
        #     secretKeyRef:
        #       name: app-secrets
        #       key: DB_HOST

        # - name: SPRING_DATASOURCE_USERNAME
        #   valueFrom:
        #     secretKeyRef:
        #       name: app-secrets
        #       key: DB_USERNAME

        # - name: SPRING_DATASOURCE_PASSWORD
        #   valueFrom:
        #     secretKeyRef:
        #       name: app-secrets
        #       key: DB_PASSWORD
        
        - name: SPRING_DATA_MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: MONGO_URI
# Legacy secret key kept for reference:
#              key: DATABASE_URL


        ports:
        - containerPort: 8080

        resources:
          requests:
            cpu: 250m
            memory: 512Mi

          limits:
            cpu: 500m
            memory: 1Gi
