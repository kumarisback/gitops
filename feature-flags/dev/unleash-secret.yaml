# Unleash's admin password, its two API tokens and its database
# credentials, from one Secrets Manager secret: the same values make the
# services' tokens in the application namespace
# (apps/dev/unleash-tokens.yaml). Tokens are
# <project>:<environment>.<secret>; the open-source edition has one project
# (default) and this instance serves its development environment.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: unleash
  namespace: feature-flags
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: unleash
    template:
      engineVersion: v2
      data:
        UNLEASH_DEFAULT_ADMIN_PASSWORD: "{{ .ADMIN_PASSWORD }}"
        INIT_BACKEND_API_TOKENS: "default:development.{{ .BACKEND_TOKEN_SECRET }}"
        INIT_FRONTEND_API_TOKENS: "default:development.{{ .FRONTEND_TOKEN_SECRET }}"
  dataFrom:
    - extract:
        key: microservices/dev/unleash
---
# The in-cluster database's credentials (feature-flags/components/rds
# points this at RDS's own secret instead).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: unleash-db
  namespace: feature-flags
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: unleash-db
    template:
      engineVersion: v2
      data:
        username: unleash
        password: "{{ .DATABASE_PASSWORD }}"
  dataFrom:
    - extract:
        key: microservices/dev/unleash
