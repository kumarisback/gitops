apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Entry point for staging's ArgoCD root Application (see
# environments/app-cluster/staging.tfvars -> argocd_gitops_repo_path in the
# tf repo). Deploys only staging's app set plus the shared platform
# components — NOT dev/prod.
#
# TODO before staging is actually turned on: add aws-lb-controller-staging.yaml
# and external-secrets-operator-staging.yaml (copy the -dev.yaml versions,
# update clusterName to microservices-staging-eks-cluster) and list them here
# — see bootstrap/envs/dev/kustomization.yaml for the pattern.
resources:
  - ../../projects/platform.yaml
  - ../../projects/staging.yaml
  # Cluster add-ons: metrics-server, logs (Loki/Alloy), metrics
  # (kube-prometheus-stack) and traces (Tempo/OTel Collector).
  - ../../../addons/applications

# Selects addons/values/cloud/ and addons/values/staging/ for every add-on
# (see addons/select-env).
configMapGenerator:
  - name: addons-env
    literals:
      - tier=cloud
      - env=staging
    options:
      disableNameSuffixHash: true
      annotations:
        config.kubernetes.io/local-config: "true"

components:
  - ../../../addons/select-env
