apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Entry point for dev's ArgoCD root Application (see
# environments/app-cluster/dev.tfvars -> argocd_gitops_repo_path in the tf
# repo). Deploys only dev's app set plus the shared platform components —
# NOT staging/prod. Every environment's cluster gets its own root
# Application pointed at its own bootstrap/envs/<env> directory, so no
# cluster ever deploys more than one environment's workloads.
resources:
  - ../../projects/platform.yaml
  - ../../projects/aws-lb-controller-dev.yaml
  - ../../projects/external-secrets-operator-dev.yaml
  - ../../projects/dev.yaml
  - ../../projects/order-service-dev.yaml
  - ../../projects/notification-service-dev.yaml
  # Cluster add-ons: metrics-server, logs (Loki/Alloy), metrics
  # (kube-prometheus-stack) and traces (Tempo/OTel Collector).
  - ../../../addons/applications
  # Kafka (roadmap step 12): Strimzi, the cluster, its topics and users.
  # Not in staging/prod yet; addons/streaming/kustomization.yaml says how.
  - ../../../addons/streaming
  - ../../projects/karpenter-dev.yaml
  - ../../projects/karpenter-nodepools-dev.yaml

# Selects addons/values/cloud/ and addons/values/dev/ for every add-on
# (see addons/select-env).
configMapGenerator:
  - name: addons-env
    literals:
      - tier=cloud
      - env=dev
    options:
      disableNameSuffixHash: true
      annotations:
        config.kubernetes.io/local-config: "true"

components:
  - ../../../addons/select-env
