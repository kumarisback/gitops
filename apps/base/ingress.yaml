apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: app-ingress
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # Shares one ALB with observability's browser-otlp Ingress (/otlp in the
    # monitoring namespace). Joining a group moves this Ingress to the
    # group's ALB: on an environment that already has an ALB, the
    # controller creates the new one and deletes the old, so its DNS name
    # changes once.
    alb.ingress.kubernetes.io/group.name: microservices
    # Edge access log: one line per request as the client saw it at the
    # ALB, the cloud's counterpart of the lab's Traefik log_type="edge"
    # lines. ALBs write it to S3 (queried with Athena), not to stdout, so
    # it needs a bucket whose policy lets ALB log delivery write to it.
    # Create that in the tf repo first, then add per environment:
    #   alb.ingress.kubernetes.io/load-balancer-attributes: access_logs.s3.enabled=true,access_logs.s3.bucket=<bucket>,access_logs.s3.prefix=<env>
    # It applies to the whole ALB group, so set it on this Ingress only.
    # Not set here: with a bucket that doesn't exist, the controller can't
    # reconcile the ALB at all.

spec:
  ingressClassName: alb

  rules:
    - http:
        paths:
          # Order Microservice — must come before the /api catch-all below,
          # since order-service's context-path is /api/orders (more specific
          # than user-service's plain /api).
          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 80

          # User Microservice — auth (/api/auth/signin, /api/auth/signup) and
          # tasks (/api/tasks) both live under user-service's /api context-path.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 80

          # Frontend UI — everything else.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
