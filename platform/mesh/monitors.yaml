# What Prometheus scrapes from the mesh. istiod: configuration pushes and
# certificates issued. ztunnel: connections and bytes between workloads,
# with their identities. Waypoints (Envoy): HTTP requests per source,
# destination and response code, istio_requests_total, which shows a
# policy's 403s too.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: istiod
  namespace: istio-system
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: istiod
  podMetricsEndpoints:
    - targetPort: 15014
      path: /metrics
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ztunnel
  namespace: istio-system
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: ztunnel
  podMetricsEndpoints:
    - targetPort: 15020
      path: /stats/prometheus
---
# Every waypoint Istio runs, in whatever namespace.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: waypoints
  namespace: istio-system
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      gateway.istio.io/managed: istio.io-mesh-controller
  podMetricsEndpoints:
    - targetPort: 15020
      path: /stats/prometheus
