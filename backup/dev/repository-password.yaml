# The password Velero encrypts backed-up volume data with (its Kopia
# repositories), from microservices/dev/velero-repository, generated once
# by tf scripts/set-secret.sh dev velero-repository. Velero would otherwise
# make this Secret itself, with a password that is the same in every
# installation. It must exist before the first backup, and never change:
# backups made with one password can't be read with another.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: velero-repo-credentials
  namespace: velero
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: velero-repo-credentials
    # Kept if this ExternalSecret goes: losing it loses the backups.
    deletionPolicy: Retain
  data:
    - secretKey: repository-password
      remoteRef:
        key: microservices/dev/velero-repository
        property: repository-password
