apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The lab (roadmap step 25, docs/BACKUP-DR.md): Velero's object store,
# SeaweedFS, in namespace backup-store. Its keys, Velero's and the
# repository password are generated by scripts/start-lab.sh into the
# git-ignored apps/local/backup.env.
#
# A store inside the cluster it backs up is for practising: lose the
# cluster, lose the backups. docs/BACKUP-DR.md has the drill that restores
# into a new cluster, where the store has to be somewhere else.
resources:
  - ../base
  - seaweedfs.yaml
  - network-policy.yaml
