# TODO: placeholder host; set the real one (with a matching ACM certificate)
# before prod goes live, and use it as root_url in the grafana-oauth secret.
grafana:
  ingress:
    hosts:
      - grafana.prod.example.com
    tls:
      - hosts:
          - grafana.prod.example.com
prometheus:
  prometheusSpec:
    # Identifies this cluster's series once they're remote-written or
    # federated alongside other clusters'.
    externalLabels:
      cluster: microservices-prod-eks-cluster
    # Production metrics have no other copy, so their volume outlives its
    # PVC (gp3-retain, platform/storage): deleting the PVC or the monitoring
    # namespace by mistake doesn't destroy 30 days of history. Set before
    # prod's first sync: a StatefulSet's volume claim template can't be
    # changed in place.
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3-retain
