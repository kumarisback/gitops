# A temporary pod with Kafka's command-line tools, connected as the
# kafka-admin super user (streaming/base/users.yaml). Not deployed by
# ArgoCD; start it when a runbook needs it and delete it afterwards:
#
#   kubectl apply -f streaming/tools/kafka-admin.yaml
#   kubectl exec -it -n kafka kafka-admin -- bash
#   # e.g.: bin/kafka-consumer-groups.sh $ADMIN --describe --group notification-service
#   kubectl delete -f streaming/tools/kafka-admin.yaml
#
# $ADMIN inside the pod is "--bootstrap-server events-kafka-bootstrap:9093
# --command-config /tmp/admin.properties". The image is the one Strimzi runs
# the brokers with (its version is in the Kafka CR and the operator chart).
apiVersion: v1
kind: Pod
metadata:
  name: kafka-admin
  namespace: kafka
  labels:
    app.kubernetes.io/name: kafka-admin
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: kafka-admin
      image: quay.io/strimzi/kafka:1.3.0-kafka-4.3.1
      command:
        - /bin/bash
        - -c
        - |
          umask 077
          cat > /tmp/admin.properties <<PROPS
          security.protocol=SSL
          ssl.keystore.type=PKCS12
          ssl.keystore.location=/etc/kafka-admin/user.p12
          ssl.keystore.password=${USER_PASSWORD}
          ssl.truststore.type=PKCS12
          ssl.truststore.location=/etc/cluster-ca/ca.p12
          ssl.truststore.password=${CA_PASSWORD}
          PROPS
          echo 'export ADMIN="--bootstrap-server events-kafka-bootstrap:9093 --command-config /tmp/admin.properties"' > /tmp/.bashrc
          exec sleep 3600
      env:
        - name: HOME
          value: /tmp
        - name: USER_PASSWORD
          valueFrom:
            secretKeyRef: {name: kafka-admin, key: user.password}
        - name: CA_PASSWORD
          valueFrom:
            secretKeyRef: {name: events-cluster-ca-cert, key: ca.password}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - {name: admin, mountPath: /etc/kafka-admin, readOnly: true}
        - {name: cluster-ca, mountPath: /etc/cluster-ca, readOnly: true}
        - {name: tmp, mountPath: /tmp}
      resources:
        requests: {cpu: 100m, memory: 512Mi}
        limits: {memory: 512Mi}
  volumes:
    - name: admin
      secret:
        secretName: kafka-admin
    - name: cluster-ca
      secret:
        secretName: events-cluster-ca-cert
    - name: tmp
      emptyDir: {}
