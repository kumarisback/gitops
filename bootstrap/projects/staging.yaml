apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: staging-env
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/kumarisback/gitops.git
    targetRevision: HEAD
    path: apps/staging
    # apps/staging/kustomization.yaml references ../base, above this
    # Application's own path — kustomize's default load restrictor blocks
    # that unless relaxed here.
    kustomize:
      buildOptions: --load-restrictor LoadRestrictionsNone
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
