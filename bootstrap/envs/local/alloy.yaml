apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy-logs
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: alloy
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 1.11.1
    helm:
      values: |
        alloy:
          clustering:
            enabled: false
          configMap:
            create: true
            content: |
              discovery.kubernetes "pods" {
                role = "pod"
              }

              discovery.relabel "pod_logs" {
                targets = discovery.kubernetes.pods.targets

                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }

                rule {
                  source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
                  separator     = "/"
                  target_label  = "job"
                }
              }

              loki.source.kubernetes "pod_logs" {
                targets    = discovery.relabel.pod_logs.output
                forward_to = [loki.process.pod_logs.receiver]
              }

              loki.process "pod_logs" {
                forward_to = [loki.write.local.receiver]

                // Only the Spring services write one JSON object per line
                // (net.logstash.logback encoder), so only they get the
                // multiline rule: a new entry starts at "{" and anything else
                // (JVM or agent output that bypasses the encoder) joins the
                // previous entry. Applied cluster-wide it glued plain-text
                // logs from nginx, ingress-nginx, Loki and ArgoCD into blocks
                // of up to 128 lines.
                stage.match {
                  selector = "{container=~\"user-service|order-service\"}"

                  stage.multiline {
                    firstline     = "^\\{"
                    max_wait_time = "3s"
                  }
                }
              }

              loki.write "local" {
                endpoint {
                  url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
                }
              }
        # loki.source.kubernetes tails pods through the Kubernetes API, and
        # without clustering every Alloy instance tails every pod it
        # discovers. As a DaemonSet that meant one copy of each log stream
        # per node. One replica covers the whole lab cluster.
        controller:
          type: deployment
          replicas: 1
        serviceMonitor:
          enabled: true
          additionalLabels:
            release: kube-prometheus-stack
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
