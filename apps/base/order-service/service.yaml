apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: production
  # ServiceMonitor selects Services by these labels, not by spec.selector.
  labels:
    app: order-service
  # The ALB health-checks targets at "/" unless told otherwise, and this
  # service answers "/" with 404 (its context path is /api/orders), so every
  # target would be unhealthy. Ignored by Traefik in the lab.
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /api/orders/actuator/health/readiness
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
  # Named so the ServiceMonitor can refer to it as port: http.
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
