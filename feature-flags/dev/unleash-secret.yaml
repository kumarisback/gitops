# Unleash's database and admin passwords and its two API tokens, from one
# Secrets Manager secret: the same values make the services' tokens in the
# application namespace (apps/dev/unleash-tokens.yaml). Tokens are
# <project>:<environment>.<secret>; the open-source edition has one project
# (default) and this instance serves its development environment.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: unleash
  namespace: feature-flags
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: unleash
    template:
      engineVersion: v2
      data:
        DATABASE_PASSWORD: "{{ .DATABASE_PASSWORD }}"
        UNLEASH_DEFAULT_ADMIN_PASSWORD: "{{ .ADMIN_PASSWORD }}"
        INIT_BACKEND_API_TOKENS: "default:development.{{ .BACKEND_TOKEN_SECRET }}"
        INIT_FRONTEND_API_TOKENS: "default:development.{{ .FRONTEND_TOKEN_SECRET }}"
  dataFrom:
    - extract:
        key: microservices/dev/unleash
