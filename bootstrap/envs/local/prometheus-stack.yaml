apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: kube-prometheus-stack
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 61.3.0
    helm:
      values: |
        prometheus:
          prometheusSpec:
            serviceMonitorSelectorNilUsesHelmValues: false
            retention: 24h
            retentionSize: 4GB
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: 1000m
                memory: 2Gi
        grafana:
          adminPassword: "admin"
          sidecar:
            dashboards:
              enabled: true
              searchNamespace: ALL
          # Loki and Tempo link to each other through trace_id, which the Java
          # agent puts in every JSON log line. $$ stops Grafana's provisioning
          # from expanding ${...} as an environment variable.
          additionalDataSources:
            - name: Loki
              type: loki
              uid: Loki
              access: proxy
              url: http://loki.monitoring.svc.cluster.local:3100
              isDefault: false
              jsonData:
                # Adds a "trace_id" link on each log line that opens it in Tempo.
                derivedFields:
                  - name: trace_id
                    matcherRegex: '"trace_id":"(\w+)"'
                    datasourceUid: Tempo
                    url: '$${__value.raw}'
            - name: Tempo
              type: tempo
              uid: Tempo
              access: proxy
              url: http://tempo.monitoring.svc.cluster.local:3200
              isDefault: false
              jsonData:
                # Adds "Logs for this span" on each span. log_type only exists on
                # the Spring services' lines, so no namespace is hard-coded.
                tracesToLogsV2:
                  datasourceUid: Loki
                  spanStartTimeShift: -5m
                  spanEndTimeShift: 5m
                  customQuery: true
                  query: '{log_type=~".+"} |= "$${__trace.traceId}"'
          persistence:
            enabled: true
            storageClassName: "standard"
            size: 2Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
