# An S3-compatible store for Velero in the lab: SeaweedFS (Apache 2.0), one
# pod running its master, volume, filer and S3 gateway. MinIO's community
# edition stopped publishing images in 2025.
apiVersion: v1
kind: Namespace
metadata:
  name: backup-store
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: backup-store
  labels:
    app.kubernetes.io/name: seaweedfs
spec:
  selector:
    app.kubernetes.io/name: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: s3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  namespace: backup-store
  labels:
    app.kubernetes.io/name: seaweedfs
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The image's seaweed user.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.54
          args:
            - server
            - -dir=/data
            # Its parts find each other on localhost, inside the pod.
            - -ip=localhost
            - -ip.bind=0.0.0.0
            - -s3
            - -s3.config=/etc/seaweedfs/s3.json
            - -master.volumeSizeLimitMB=1024
          ports:
            - name: s3
              containerPort: 8333
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            # Velero's keys, allowed the bucket velero only (start-lab.sh).
            - name: s3-config
              mountPath: /etc/seaweedfs
              readOnly: true
        # Makes the bucket Velero writes to, once the store is up, then
        # waits: a store's own setup, not a job to remember.
        - name: create-bucket
          image: chrislusf/seaweedfs:4.54
          command:
            - sh
            - -c
            - |
              until echo "s3.bucket.list" | weed shell -master=localhost:9333 > /dev/null 2>&1; do sleep 3; done
              echo "s3.bucket.create -name velero" | weed shell -master=localhost:9333 2>&1 | grep -E "created|already exists"
              exec sleep 2147483647
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: s3-config
          secret:
            secretName: seaweedfs-s3-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
