apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app-local
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/kumarisback/gitops.git
    # HEAD (main) when applied as-is. scripts/start-lab.sh replaces both
    # HEADs below with the current branch, or LAB_REVISION if set, so a
    # lesson branch can be tested before it's merged.
    targetRevision: HEAD
    path: bootstrap/envs/local
    kustomize:
      # Keep the child apps (and the add-ons' values files) on the same
      # revision as this one.
      patches:
        # Every child Application deploys the same revision as this root:
        # the Git-sourced ones (part-of=gitops-config) through their source,
        # the Helm add-ons (part-of=cluster-addons) through their values
        # source. start-lab.sh replaces HEAD with LAB_REVISION.
        - target:
            kind: Application
            labelSelector: app.kubernetes.io/part-of=gitops-config
          patch: |-
            - op: replace
              path: /spec/source/targetRevision
              value: HEAD
        - target:
            kind: Application
            labelSelector: app.kubernetes.io/part-of=cluster-addons
          patch: |-
            - op: replace
              path: /spec/sources/1/targetRevision
              value: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
