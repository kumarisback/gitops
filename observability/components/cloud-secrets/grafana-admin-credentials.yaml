# Grafana's admin login (grafana.admin.existingSecret in
# addons/values/cloud/kube-prometheus-stack.yaml). ENV is filled in by this
# component's replacements.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: grafana-admin-credentials
  data:
    - secretKey: admin-user
      remoteRef:
        key: microservices/ENV/grafana
        property: admin_user
    - secretKey: admin-password
      remoteRef:
        key: microservices/ENV/grafana
        property: admin_password
