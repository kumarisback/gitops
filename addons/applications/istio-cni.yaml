# Istio 1.31 in ambient mode (roadmap step 18, docs/MESH.md).
# Istio's CNI agent (a DaemonSet): moves the traffic of every pod in the
# mesh through ztunnel, inside the pod's own network namespace, without a
# sidecar or any change to the pod.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-cni
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: cluster-addons
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - chart: cni
      repoURL: https://blob.istio.io/istio-release/charts
      targetRevision: 1.31.3
      helm:
        # TIER and ENV are filled in by addons/select-env (see
        # kustomization.yaml); missing files are skipped.
        ignoreMissingValueFiles: true
        valueFiles:
          - $values/addons/values/common/istio-cni.yaml
          - $values/addons/values/TIER/istio-cni.yaml
          - $values/addons/values/ENV/istio-cni.yaml
    - repoURL: https://github.com/kumarisback/gitops.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Istio's CRDs are too large for client-side apply.
      - ServerSideApply=true
