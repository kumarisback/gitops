# Applies only to containers that don't set their own requests/limits.
# All three services set explicit values, so this is a safety net for
# anything added later (a debug pod, a Job): without requests it couldn't
# be scheduled against the quota at all.
apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
spec:
  limits:
  - type: Container
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    default:
      cpu: 250m
      memory: 256Mi
