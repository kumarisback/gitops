apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: cluster-addons
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - chart: tempo
      repoURL: https://grafana.github.io/helm-charts
      targetRevision: 1.24.4
      helm:
        # TIER and ENV are filled in by addons/select-env (see
        # kustomization.yaml); missing files are skipped.
        ignoreMissingValueFiles: true
        valueFiles:
          - $values/addons/values/common/tempo.yaml
          - $values/addons/values/TIER/tempo.yaml
          - $values/addons/values/ENV/tempo.yaml
    - repoURL: https://github.com/kumarisback/gitops.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
