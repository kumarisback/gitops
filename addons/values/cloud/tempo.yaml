tempo:
  # Traces in S3 (14 days), not on the pod's disk: survives the pod and the
  # node, and doesn't fill a PVC. The bucket is per environment, so its name
  # is in addons/values/<env>/tempo.yaml; every environment is in us-east-1.
  # Tempo reaches the bucket through the IRSA-annotated `tempo`
  # ServiceAccount (tf repo, 02-services).
  retention: 336h
  storage:
    trace:
      backend: s3
      s3:
        endpoint: s3.us-east-1.amazonaws.com
        region: us-east-1
serviceAccount:
  create: false
  name: tempo
# The PVC still holds the write-ahead log.
persistence:
  storageClassName: gp3
  size: 10Gi
