# The credentials Kong's consumers use (apps/base/kong.yaml, roadmap step
# 17), made in the cluster by External Secrets, never in Git.
#
# Partner API keys: generated once by External Secrets' Password generator
# (refreshInterval 0: never regenerated), so no person or system outside the
# cluster ever had them. Hand one to its partner from the Secret:
#   kubectl get secret partner-basic-key -n development -o jsonpath='{.data.key}' | base64 -d
# Rotate by deleting the Secret; a new key is generated and the old one stops
# working.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: partner-api-key
spec:
  length: 40
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: partner-basic-key
spec:
  refreshInterval: "0"
  target:
    name: partner-basic-key
    template:
      metadata:
        labels:
          konghq.com/credential: key-auth
      data:
        key: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: partner-api-key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: partner-premium-key
spec:
  refreshInterval: "0"
  target:
    name: partner-premium-key
    template:
      metadata:
        labels:
          konghq.com/credential: key-auth
      data:
        key: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: partner-api-key
---
# user-service's public key, for checking sign-in tokens at the gateway: the
# Secrets Manager secret tf scripts/set-secret.sh writes next to the private
# key (microservices/dev/jwt-public-key). Not secret, but per environment,
# so it isn't in Git either. Rotating the signing key updates both.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: user-service-jwt
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: user-service-jwt
    template:
      metadata:
        labels:
          konghq.com/credential: jwt
      data:
        # The token's iss claim (the plugin's key_claim_name).
        key: user-service
        algorithm: RS256
        rsa_public_key: "{{ .publickey }}"
  data:
    - secretKey: publickey
      remoteRef:
        key: microservices/dev/jwt-public-key
