apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector-sampler
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: cluster-addons
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - chart: opentelemetry-collector
      repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      targetRevision: 0.173.1
      helm:
        # TIER and ENV are filled in by addons/select-env (see
        # kustomization.yaml); missing files are skipped.
        ignoreMissingValueFiles: true
        valueFiles:
          - $values/addons/values/common/otel-collector-sampler.yaml
          - $values/addons/values/TIER/otel-collector-sampler.yaml
          - $values/addons/values/ENV/otel-collector-sampler.yaml
    - repoURL: https://github.com/kumarisback/gitops.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
