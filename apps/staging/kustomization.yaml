apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - ../base
  - app-secrets.yaml

namespace: staging

images:
  # Update the newTag value to deploy a new version of the frontend service
  - name: 602367507570.dkr.ecr.us-east-1.amazonaws.com/frontend
    newTag: "latest"
  # You can add other services here like order-service or user-service
  # - name: 602367507570.dkr.ecr.us-east-1.amazonaws.com/order-service
  #   newTag: "latest"

# OpenTelemetry: shared agent settings come from ../components/otel-instrumentation.
# Sampler is a 50% ratio, not always_on — staging traffic can be significant
# during load/perf testing. Tune OTEL_TRACES_SAMPLER_ARG as needed.
components:
  - ../components/otel-instrumentation

configMapGenerator:
  - name: otel-environment
    literals:
      - DEPLOYMENT_ENVIRONMENT=staging
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=staging,k8s.namespace.name=staging
      - OTEL_TRACES_SAMPLER=parentbased_traceidratio
      - OTEL_TRACES_SAMPLER_ARG=0.5
