# The chart leaves the security context empty; the same restrictions as
# every other pod here (the operator writes only to its in-memory /tmp).
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 256Mi
