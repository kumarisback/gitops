# Argo Workflows (roadmap step 21, docs/WORKFLOWS.md). The controller and
# server run in namespace argo; workflows run in namespace workflows only,
# so a workflow can never run as the controller's or the server's account,
# only as one of the accounts made for workflows there (argo-workflow by
# default; ci-builder, archive-checker; automation/).
controller:
  workflowNamespaces: [workflows]
  # Only workflows that run a WorkflowTemplate. Alone this doesn't stop a
  # Workflow overriding its template's fields (its account, its pods): the
  # admission policy in automation/base/admission-policy.yaml does.
  workflowRestrictions:
    templateReferencing: Strict
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  metricsConfig:
    enabled: true
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack
  # What every workflow gets unless it says otherwise.
  workflowDefaults:
    spec:
      serviceAccountName: argo-workflow
      # A finished workflow (and its record) goes after a day, a failed one
      # after a week, for someone to look at.
      ttlStrategy:
        secondsAfterSuccess: 86400
        secondsAfterFailure: 604800
      # A step's pod goes as soon as it succeeds; failed ones stay, with
      # their logs, until the workflow does.
      podGC:
        strategy: OnPodSuccess

workflow:
  serviceAccount:
    create: true
    name: argo-workflow
  rbac:
    create: true
    # The permissions a workflow pod needs to report on itself, for the
    # other accounts workflows run as (automation/base/rbac.yaml).
    serviceAccounts:
      - name: ci-builder
        namespace: workflows
      - name: archive-checker
        namespace: workflows

server:
  # The UI and API ask for a Kubernetes token and act with its
  # permissions (kubectl create token, docs/WORKFLOWS.md): there's no
  # server account of its own for anyone who reaches the port to borrow.
  # Reached only with kubectl port-forward.
  authModes: [client]
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
