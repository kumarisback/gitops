apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Lab-sized Kafka: one combined controller+broker node (node-pool.yaml) on
# the KinD default storage class, everything replicated once, no racks
# (KinD nodes have no zone label).
resources:
  - ../base
  - node-pool.yaml

patches:
  - patch: |-
      $patch: delete
      apiVersion: kafka.strimzi.io/v1
      kind: KafkaNodePool
      metadata:
        name: controller
  - patch: |-
      $patch: delete
      apiVersion: kafka.strimzi.io/v1
      kind: KafkaNodePool
      metadata:
        name: broker
  - target:
      kind: Kafka
      name: events
    patch: |-
      - op: remove
        path: /spec/kafka/rack
      - op: replace
        path: /spec/kafka/config
        value:
          default.replication.factor: 1
          min.insync.replicas: 1
          offsets.topic.replication.factor: 1
          transaction.state.log.replication.factor: 1
          transaction.state.log.min.isr: 1
          auto.create.topics.enable: false
  - target:
      kind: KafkaTopic
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/config/min.insync.replicas
        value: 1
