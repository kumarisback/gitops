apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Change data capture from Unleash's database into Kafka (roadmap step 23,
# docs/DATABASE.md), on the events archive's Kafka Connect cluster: include
# it after ../events-archive. It needs
#   - a Connect image with Debezium (app repo kafka-connect/, since step 23);
#   - feature-flags/components/cdc in the same environment (the
#     credentials, the network policy);
#   - with Unleash on RDS, ../flag-changes-rds as well.
resources:
  - connector.yaml

patches:
  # Connect resolves ${secrets:<namespace>/<secret>:<key>} in connector
  # configs from Kubernetes Secrets (Strimzi's provider, in its image).
  - target:
      kind: KafkaConnect
      name: events-connect
    patch: |-
      - op: add
        path: /spec/config/config.providers
        value: secrets
      - op: add
        path: /spec/config/config.providers.secrets.class
        value: io.strimzi.kafka.KubernetesSecretConfigProvider
  # Connect's Kafka user writes the two topics; the archive reads the first.
  - target:
      kind: KafkaUser
      name: events-connect
    patch: |-
      - op: add
        path: /spec/authorization/acls/-
        value:
          resource: { type: topic, name: flags.public.events, patternType: literal }
          operations: [Read, Write, Describe]
      - op: add
        path: /spec/authorization/acls/-
        value:
          resource: { type: topic, name: debezium-heartbeat.flags, patternType: literal }
          operations: [Write, Describe]
  # Flag changes kept a year in S3, next to orders and users.
  - target:
      kind: KafkaConnector
      name: events-archive
    patch: |-
      - op: replace
        path: /spec/config/topics
        value: orders,users,flags.public.events
