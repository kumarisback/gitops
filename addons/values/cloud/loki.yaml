loki:
  commonConfig:
    replication_factor: 3
  # Required: chart 6.x refuses to render without a schema.
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  # TODO: placeholder values — fill in the real bucket names and region
  # for each environment (dev/staging/prod) before this Application is
  # synced there. Until these are real, Loki will crash-loop on startup
  # and nothing will be ingested. ruler/admin may be the same bucket
  # as chunks; the chart renders all three into the config.
  storage:
    type: s3
    bucketNames:
      chunks: <your-loki-s3-bucket-name>
      ruler: <your-loki-s3-bucket-name>
      admin: <your-loki-s3-bucket-name>
    s3:
      region: <your-aws-region>
      s3ForcePathStyle: false

  # 30 days for application logs, 7 for platform logs; the compactor
  # deletes expired chunks from S3 (without this the bucket only grows).
  limits_config:
    retention_period: 720h
    ingestion_rate_mb: 8
    ingestion_burst_size_mb: 16
  compactor:
    retention_enabled: true
    delete_request_store: s3
  runtimeConfig:
    overrides:
      platform:
        retention_period: 168h
        ingestion_rate_mb: 4
        ingestion_burst_size_mb: 8

# Use the pre-created ServiceAccount `loki` in the monitoring namespace,
# annotated with eks.amazonaws.com/role-arn for S3 access (IRSA). This is
# a top-level chart value; under `loki:` it was silently ignored and the
# chart created its own unannotated ServiceAccount.
serviceAccount:
  create: false
  name: loki

# Three replicas with replication factor 3 (memberlist ring): a write is
# acknowledged by two of three, so one pod or node can go away without
# losing logs or failing pushes.
singleBinary:
  replicas: 3
  persistence:
    storageClass: gp3
    size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1.5Gi

# The chart's defaults size the memcached chunk cache at 8 GB of RAM;
# 1 GB and 512 MB are plenty at this volume.
chunksCache:
  allocatedMemory: 1024
resultsCache:
  allocatedMemory: 512
