apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Feature flags (roadmap step 22, docs/FEATURE-FLAGS.md): Unleash and its
# database, from feature-flags/<env>. The lab and dev run it; an environment
# opts in with one line in bootstrap/envs/<env>:
#
#   - ../../../addons/feature-flags
#
# and a feature-flags/<env> overlay with its Secret unleash.
#
# Reloader restarts Unleash when its database password changes (on RDS,
# where the password rotates; docs/DATABASE.md). It is installed only where
# Unleash runs, and may read Secrets only in namespace feature-flags.
resources:
  - reloader.yaml
  - feature-flags-config.yaml
