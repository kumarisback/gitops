# order-service in the kind lab, deployed with charts/microservice
# (docs/HELM.md) instead of Kustomize. Only what differs from the chart's
# defaults (charts/microservice/values.yaml).
image:
  # Built and loaded into kind by start-lab-podman.sh, never pulled.
  tag: latest
  pullPolicy: IfNotPresent
# KEDA (roadmap step 15, docs/KEDA.md) on two signals, whichever asks for
# more replicas: requests per second per replica (Prometheus; 20 is a
# starting point until step 40's load tests measure what a replica
# handles) and CPU as before. Never to zero: an API must answer at once.
# staging and prod keep the plain CPU autoscaler, to compare. The lab
# allows a second replica, to see it scale.
autoscaling:
  minReplicas: 1
  maxReplicas: 2
  keda:
    enabled: true
    triggers:
      - type: prometheus
        metadata:
          serverAddress: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
          query: sum(rate(http_server_requests_seconds_count{namespace="development", job="order-service", uri!~".*actuator.*"}[2m]))
          threshold: "20"
      - type: cpu
        metricType: Utilization
        metadata:
          value: "70"
openTelemetry:
  environment: local
# The lab logs every request payload (apps/components/request-logging).
requestLogging:
  requestBody: ALWAYS
extraEnv:
  # As for user-service in kustomization.yaml.
  - name: MANAGEMENT_ENDPOINT_HEALTH_VALIDATE_GROUP_MEMBERSHIP
    value: "false"
  # The kill switch around order events (roadmap step 22,
  # docs/FEATURE-FLAGS.md): Unleash's client API and this environment's
  # backend token.
  - name: UNLEASH_URL
    value: http://unleash.feature-flags:4242/flags/api/
  - name: UNLEASH_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: unleash-backend-token
        key: token
        # Without it (not made yet), the client is refused and every flag
        # keeps its fallback: events keep going out.
        optional: true
# Publishes OrderCreated events to Kafka (roadmap step 12) with the
# connection from the order-service-kafka KafkaAccess Secret
# (apps/components/kafka-clients).
kafka:
  enabled: true
  accessSecret: order-service-kafka
# Released as a canary with Argo Rollouts (roadmap step 20,
# docs/ROLLOUTS.md), weighted by the mesh's VirtualService. Two steps of a
# minute each in the lab, enough to watch it work.
rollout:
  enabled: true
  virtualService: order-service
  # With little or no traffic here, a canary with no requests to judge
  # goes on rather than waiting for a person (production waits).
  analysis:
    withoutRequests: pass
  steps:
    - setWeight: 20
    - pause: {duration: 1m}
    - setWeight: 50
    - pause: {duration: 1m}
