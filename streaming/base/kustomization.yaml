apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The Kafka cluster "events" and what lives with it: topics, users and
# their ACLs, metrics, alerts. Deployed into the kafka namespace by the
# streaming-config Application (addons/streaming), which only environments
# running Kafka include. Each overlay (streaming/<env>) sizes it.
namespace: kafka

resources:
  - kafka.yaml
  - kafka-metrics.yaml
  - topics.yaml
  - users.yaml
  - podmonitors.yaml
  - kafka-alerts.yaml
  - schema-registry.yaml
  - network-policies.yaml
