apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: kube-prometheus-stack
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 61.3.0
    helm:
      values: |
        prometheus:
          prometheusSpec:
            # Instructs Prometheus to look for ServiceMonitors across all namespaces
            serviceMonitorSelectorNilUsesHelmValues: false
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: 1000m
                memory: 2Gi
        grafana:
          adminPassword: "admin" # Replace with an ExternalSecrets reference in production!
          persistence:
            enabled: true
            storageClassName: "gp3"
            size: 10Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true