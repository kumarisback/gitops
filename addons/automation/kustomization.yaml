apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Workflows and event-driven automation (roadmap step 21, docs/WORKFLOWS.md):
# Argo Workflows, Argo Events, and what they run (automation/<env>). Like
# addons/streaming, an environment opts in with one line in
# bootstrap/envs/<env>: the lab and dev run it, because its Kafka trigger
# needs Kafka. To add another environment, add
#
#   - ../../../addons/automation
#
# to its bootstrap kustomization and create automation/<env>.
resources:
  - argo-workflows.yaml
  - argo-events.yaml
  - automation-config.yaml
