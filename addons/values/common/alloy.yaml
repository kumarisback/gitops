alloy:
  configMap:
    create: true
    # Same pipeline in every environment. The clustering block in
    # loki.source.kubernetes only takes effect where the tier file sets
    # alloy.clustering.enabled.
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "job"
        }
      }

      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.pod_logs.receiver]

        // With alloy.clustering.enabled the replicas shard the pods
        // between them so each is tailed once; without clustering
        // this block is a no-op and the one replica tails them all.
        clustering {
          enabled = true
        }
      }

      loki.process "pod_logs" {
        forward_to = [loki.write.default.receiver]

        // Only the Spring services write one JSON object per line
        // (net.logstash.logback encoder), so only they get the
        // multiline rule: a new entry starts at "{" and anything else
        // (JVM or agent output that bypasses the encoder) joins the
        // previous entry. Applied cluster-wide it glued plain-text
        // logs from nginx, ingress-nginx, Loki and ArgoCD into blocks
        // of up to 128 lines.
        stage.match {
          selector = "{container=~\"user-service|order-service\"}"

          stage.multiline {
            firstline     = "^\\{"
            max_wait_time = "3s"
          }
        }

        // Label each Spring log line log_type="api" (the per-request
        // access log from RequestLoggingFilter, logger access.<svc>.http)
        // or log_type="server" (everything else) so Grafana can pick
        // one by label. Two values, so the index barely grows. No Go
        // templates in this file: the chart renders it through tpl.
        stage.match {
          selector = "{container=~\"user-service|order-service\"} |= `\"logger\":\"access.`"

          stage.static_labels {
            values = { log_type = "api" }
          }
        }

        stage.match {
          selector = "{container=~\"user-service|order-service\"} != `\"logger\":\"access.`"

          stage.static_labels {
            values = { log_type = "server" }
          }
        }
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }
controller:
  type: deployment
serviceMonitor:
  enabled: true
  additionalLabels:
    release: kube-prometheus-stack
