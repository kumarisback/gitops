# frontend as an Argo Rollout (roadmap step 20, docs/ROLLOUTS.md), released
# blue/green: a new version starts next to the current one, reachable only
# through Service frontend-preview, and takes over Service frontend (and so
# every user) at once when someone promotes it:
#
#   kubectl argo rollouts promote frontend -n <namespace>
#
# Until then users see the current version; `abort` drops the new one.
apiVersion: argoproj.io/v1alpha1
kind: Rollout

metadata:
  name: frontend
  namespace: production
  annotations:
    # The kind exists once the argo-rollouts add-on has installed its
    # CRDs; until then ArgoCD skips the dry run for this object.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true

spec:
  # No replicas here: the HorizontalPodAutoscaler (hpa.yaml) owns the count.
  # A value in Git would make ArgoCD's self-heal reset it on every sync, so
  # the HPA and ArgoCD would keep undoing each other.

  selector:
    matchLabels:
      app: frontend

  strategy:
    blueGreen:
      # Argo Rollouts points each Service at its version's pods.
      activeService: frontend
      previewService: frontend-preview
      # A person decides: the new version waits in preview until promoted.
      autoPromotionEnabled: false
      # One pod is enough to look at; it grows to the full count when
      # promoted, before it takes the traffic.
      previewReplicaCount: 1
      # The old version stays up 30 s after the switch, for requests in
      # flight and for proxies still on the old endpoints.
      scaleDownDelaySeconds: 30

  template:
    metadata:
      labels:
        app: frontend

    spec:
      serviceAccountName: frontend
      terminationGracePeriodSeconds: 15

      # nginx's official image runs as uid/gid 101 ("nginx") when not root;
      # this app's Dockerfile has no USER line so it'd otherwise default to
      # root, which runAsNonRoot below would reject at container start.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101

      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: frontend

      containers:
      - name: frontend

        image: 602367507570.dkr.ecr.us-east-1.amazonaws.com/frontend:latest

        ports:
        - containerPort: 80

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
            # Master process needs this to bind port 80 as a non-root user.
            add: ["NET_BIND_SERVICE"]

        lifecycle:
          preStop:
            exec:
              # Gives kube-proxy/LB time to stop routing here before nginx
              # actually receives SIGTERM.
              command: ["sh", "-c", "sleep 5"]

        startupProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 2
          failureThreshold: 15

        readinessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 5
          failureThreshold: 3

        livenessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 10
          failureThreshold: 3

        resources:
          requests:
            cpu: 100m
            memory: 256Mi

          limits:
            cpu: 250m
            memory: 512Mi

        volumeMounts:
        # readOnlyRootFilesystem forces these three out of the image's
        # root filesystem — nginx writes its temp/cache dirs and pid file
        # here even for a purely static site.
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run
        - name: tmp
          mountPath: /tmp
        # Feature flags (roadmap step 22, docs/FEATURE-FLAGS.md): served as
        # /config/runtime-config.json; where Unleash's frontend API is, and
        # this environment's frontend token.
        - name: runtime-config
          mountPath: /usr/share/nginx/html/config
          readOnly: true

      volumes:
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-run
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      # Optional: where an environment has no Unleash, the file is missing
      # and the frontend runs with every flag off.
      - name: runtime-config
        secret:
          secretName: frontend-runtime-config
          optional: true
