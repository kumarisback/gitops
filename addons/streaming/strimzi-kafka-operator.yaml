# The Strimzi Cluster Operator: runs Kafka from Kafka/KafkaNodePool/
# KafkaTopic/KafkaUser resources (streaming/). It watches only the kafka
# namespace, where the cluster lives.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi-kafka-operator
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: cluster-addons
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - chart: strimzi-kafka-operator
      repoURL: https://strimzi.io/charts/
      # Strimzi 1.x serves only the kafka.strimzi.io/v1 API and needs
      # Kubernetes 1.32 or later; Kafka 4.2.0-4.3.1.
      targetRevision: 1.3.0
      helm:
        # TIER and ENV are filled in by addons/select-env; missing files are
        # skipped.
        ignoreMissingValueFiles: true
        valueFiles:
          - $values/addons/values/common/strimzi-kafka-operator.yaml
          - $values/addons/values/TIER/strimzi-kafka-operator.yaml
          - $values/addons/values/ENV/strimzi-kafka-operator.yaml
    - repoURL: https://github.com/kumarisback/gitops.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The Kafka CRD is too large for client-side apply's
      # last-applied-configuration annotation.
      - ServerSideApply=true
