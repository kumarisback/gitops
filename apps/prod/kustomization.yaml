apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - app-secrets.yaml
namespace: production

images:
  # Update the newTag value to deploy a new version of the frontend service
  - name: 602367507570.dkr.ecr.us-east-1.amazonaws.com/frontend
    newTag: "v1.0.0"
  # You can add other services here like order-service or user-service
  # - name: 602367507570.dkr.ecr.us-east-1.amazonaws.com/order-service
  #   newTag: "v1.0.0"

# OpenTelemetry: shared agent settings come from ../components/otel-instrumentation.
# The agent sends every span (parentbased_always_on); which traces are kept
# is decided after the fact by the collector's tail sampler
# (addons/values/*/otel-collector-sampler.yaml): all errors, all requests
# over 500ms, and a share of the rest per environment.
components:
  - ../components/otel-instrumentation

configMapGenerator:
  - name: otel-environment
    literals:
      - DEPLOYMENT_ENVIRONMENT=production
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=production,k8s.namespace.name=production
      - OTEL_TRACES_SAMPLER=parentbased_always_on
