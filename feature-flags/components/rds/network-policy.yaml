# Unleash to its database on RDS (or RDS Proxy): outside the cluster, so
# addresses rather than pods. Only the private data subnets, where RDS and
# the proxy live (one per availability zone; the environment's ConfigMap
# unleash-rds gives them, kustomization.yaml). Not the VPC's whole range:
# with the VPC CNI every pod has an address in it, and Unleash would reach
# any of them on 5432. RDS's security group, in turn, admits the cluster's
# nodes only, on this port only (tf modules/database).
#
# Every environment here has two zones; a third adds a third ipBlock and
# replacement.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: unleash-rds
  namespace: feature-flags
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: unleash
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: DATA_SUBNET_0
        - ipBlock:
            cidr: DATA_SUBNET_1
      ports:
        - port: 5432
          protocol: TCP
