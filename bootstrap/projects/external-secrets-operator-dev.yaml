# Moved here from the tf repo's helm_release, same reasoning as
# aws-lb-controller-dev.yaml. This installs the operator itself
# (Deployment, CRDs, webhook); platform/external-secrets.yaml (the
# ClusterSecretStore) is unaffected and already GitOps-managed.
#
# sync-wave -10 for the same reason as the LB controller: deploy early,
# delete last, so ExternalSecret resources get cleaned up before the
# operator that reconciles them disappears.
#
# No environment-specific values needed here (installCRDs + the
# ServiceAccount name are the same across environments), so unlike
# aws-lb-controller-dev.yaml this can be reused as-is for staging/prod
# once those environments exist — copy this file, change targetRevision
# only if that environment needs a different chart version.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 0.10.4
    helm:
      values: |
        installCRDs: true
        serviceAccount:
          create: false
          name: external-secrets-sa
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
