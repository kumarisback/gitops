# The password of Kong's rate-limit counters (platform/kong/redis.yaml,
# roadmap step 17), generated once in the cluster by External Secrets and
# never anywhere else: Valkey and the rate-limiting plugins read it from
# Secret kong-redis. The lab's is made by scripts/start-lab.sh. Rotate by
# deleting the Secret, then restarting kong-redis (it reads it at start).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: kong-redis
  namespace: kong
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kong-redis
  namespace: kong
spec:
  refreshInterval: "0"
  target:
    name: kong-redis
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: kong-redis
