# Merged into ConfigMap ingress-nginx/ingress-nginx-controller by
# scripts/start-lab.sh. The Ingress annotations in apps/local/kustomization.yaml
# turn tracing on for app-ingress, but the controller defaults are
# otlp-collector-host: "" and otel-sampler: AlwaysOff, so it recorded no spans
# and had nowhere to send them. Keys: ingress-nginx v1.12 configmap docs.
data:
  enable-opentelemetry: "true"
  # OTLP over gRPC; the collector's otlp receiver listens on 4317.
  otlp-collector-host: otel-collector-opentelemetry-collector.monitoring.svc
  otlp-collector-port: "4317"
  otel-service-name: ingress-nginx
  otel-sampler: AlwaysOn
