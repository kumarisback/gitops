apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: local-microservices-alerts
  namespace: development
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: local-microservices
      rules:
        - alert: LocalServiceDown
          expr: up{namespace="development",job=~"(order-service|user-service).*"} == 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Local backend service is down"
            description: "{{ $labels.job }} has been unavailable for more than 2 minutes."
        - alert: LocalPodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="development"}[15m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Local application Pod is restarting"
            description: "{{ $labels.pod }} restarted in the last 15 minutes."
        - alert: LocalApiHighErrorRate
          expr: |
            sum(rate(http_server_requests_seconds_count{namespace="development",status=~"5.."}[5m]))
            /
            sum(rate(http_server_requests_seconds_count{namespace="development"}[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Local API error rate is high"
            description: "More than 5% of observed API requests returned 5xx responses."
        - alert: LocalApiHighLatency
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(http_server_requests_seconds_bucket{namespace="development"}[5m]))
            ) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Local API latency is high"
            description: "The 95th percentile API latency is above one second."
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: local-microservices-dashboard
  namespace: development
  labels:
    grafana_dashboard: "1"
data:
  local-microservices.json: |
    {
      "title": "Local Microservices",
      "tags": ["local", "microservices"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "15s",
      "panels": [
        {"type":"timeseries","title":"Pod CPU","gridPos":{"h":8,"w":12,"x":0,"y":0},"targets":[{"expr":"sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"development\",pod=~\"(frontend|user-service|order-service)-.*\",container!=\"POD\",container!=\"\"}[5m]))","refId":"A"}]},
        {"type":"timeseries","title":"Pod Memory","gridPos":{"h":8,"w":12,"x":12,"y":0},"targets":[{"expr":"sum by (pod) (container_memory_working_set_bytes{namespace=\"development\",pod=~\"(frontend|user-service|order-service)-.*\",container!=\"POD\",container!=\"\"})","refId":"A"}]},
        {"type":"timeseries","title":"API Request Rate","gridPos":{"h":8,"w":12,"x":0,"y":8},"targets":[{"expr":"sum by (job, method, status) (rate(http_server_requests_seconds_count{namespace=\"development\"}[5m]))","refId":"A"}]},
        {"type":"timeseries","title":"API 5xx Rate","gridPos":{"h":8,"w":12,"x":12,"y":8},"targets":[{"expr":"sum by (job, status) (rate(http_server_requests_seconds_count{namespace=\"development\",status=~\"5..\"}[5m]))","refId":"A"}]},
        {"type":"stat","title":"Ready Pods","gridPos":{"h":5,"w":8,"x":0,"y":16},"targets":[{"expr":"sum(kube_pod_status_ready{namespace=\"development\",condition=\"true\",pod=~\"(frontend|user-service|order-service)-.*\"})","refId":"A"}]},
        {"type":"timeseries","title":"API P95 Latency","gridPos":{"h":8,"w":16,"x":8,"y":16},"targets":[{"expr":"histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=\"development\"}[5m])))","refId":"A"}]}
      ]
    }
