apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: order-service-monitor
  namespace: production
  labels:
    # Matches the kube-prometheus-stack release. Prometheus here selects every
    # ServiceMonitor (serviceMonitorSelectorNilUsesHelmValues: false), so this
    # only matters if that setting is ever turned back on.
    release: kube-prometheus-stack
spec:
  # Matches labels on the order-service Service object (see service.yaml).
  selector:
    matchLabels:
      app: order-service
  endpoints:
  - port: http
    # server.servlet.context-path=/api/orders prefixes the actuator path.
    path: /api/orders/actuator/prometheus
    interval: 15s
