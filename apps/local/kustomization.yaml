apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - ../base
  - resourcequota.yaml
  - limitrange.yaml
  # Lab-only database (see mongodb.yaml).
  - mongodb.yaml

namespace: development

# order-service is deployed from charts/microservice with
# order-service.values.yaml (bootstrap/envs/local/order-service.yaml).

# OpenTelemetry: shared agent settings come from ../components/otel-instrumentation.
# The agent sends every span (parentbased_always_on); which traces are kept
# is decided after the fact by the collector's tail sampler
# (addons/values/*/otel-collector-sampler.yaml): all errors, all requests
# over 500ms, and a share of the rest per environment.
components:
  - ../components/otel-instrumentation
  - ../components/request-logging
  # Kafka connections for the services (roadmap step 12; this environment
  # runs Kafka, addons/streaming).
  - ../components/kafka-clients

configMapGenerator:
  - name: otel-environment
    literals:
      - DEPLOYMENT_ENVIRONMENT=local
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=local,k8s.namespace.name=development
      - OTEL_TRACES_SAMPLER=parentbased_always_on
  # Request payloads in the API log (see ../components/request-logging):
  # the lab: see every payload while developing.
  - name: request-logging
    literals:
      - APP_HTTP_LOGGING_REQUEST_BODY=ALWAYS

# 100% Local: Do NOT pull from AWS ECR. Use images loaded directly into KinD.
# One replica each: the HPA patches below lower minReplicas to 1.
patches:
  - target:
      kind: Deployment
      name: user-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ORDER_SERVICE_URL
          value: http://order-service

  - target:
      kind: HorizontalPodAutoscaler
      name: frontend-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: user-service-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 1
  # One mesh waypoint in the lab (apps/base/mesh.yaml asks for two).
  - target:
      kind: HorizontalPodAutoscaler
      name: waypoint
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 1
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  # frontend is an Argo Rollout (roadmap step 20), not a Deployment.
  - target:
      kind: Rollout
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: user-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MANAGEMENT_ENDPOINT_HEALTH_VALIDATE_GROUP_MEMBERSHIP
          value: "false"

# The service mesh policies (apps/base/mesh.yaml) name callers in this
# namespace as */sa/<name> plus namespaces: [<this namespace>]; this fills
# in the namespace, so a ServiceAccount of the same name elsewhere doesn't
# match.
replacements:
  - source:
      kind: Namespace
      fieldPath: metadata.name
    targets:
      - select:
          group: security.istio.io
          kind: AuthorizationPolicy
          labelSelector: same-namespace-callers=true
        fieldPaths:
          - spec.rules.*.from.*.source.namespaces.*
