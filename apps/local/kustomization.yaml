apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - ../base
  - resourcequota.yaml
  - limitrange.yaml
  - observability.yaml

namespace: development

# 100% Local: Do NOT pull from AWS ECR. Use images loaded directly into KinD.
patches:
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: order-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: user-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: order-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_SERVICE_NAME
          value: order-service
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector-opentelemetry-collector.monitoring:4318
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: http/protobuf
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_TRACES_SAMPLER
          value: always_on
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_TRACES_EXPORTER
          value: otlp
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_METRICS_EXPORTER
          value: none
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_LOGS_EXPORTER
          value: none
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_PROPAGATORS
          value: tracecontext,baggage
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_RESOURCE_ATTRIBUTES
          value: deployment.environment=local,k8s.namespace.name=development
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_INSTRUMENTATION_LOGBACK_MDC_TRACE_ID
          value: "true"
  - target:
      kind: Deployment
      name: user-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_SERVICE_NAME
          value: user-service
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector-opentelemetry-collector.monitoring:4318
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: http/protobuf
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_TRACES_SAMPLER
          value: always_on
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_TRACES_EXPORTER
          value: otlp
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_METRICS_EXPORTER
          value: none
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_LOGS_EXPORTER
          value: none
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_PROPAGATORS
          value: tracecontext,baggage
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_RESOURCE_ATTRIBUTES
          value: deployment.environment=local,k8s.namespace.name=development
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_INSTRUMENTATION_LOGBACK_MDC_TRACE_ID
          value: "true"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ORDER_SERVICE_URL
          value: http://order-service
      # --- ADDED: RUNTIME LOG FILTERS FOR DISPATCHER REQUESTS ---
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB_SERVLET_DISPATCHERSERVLET
          value: "DEBUG"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB_FILTER_COMMONSREQUESTLOGGINGFILTER
          value: "DEBUG"
      # --- ADDED: FORCE ENTIRE ROOT LEVEL TO DEBUG TO BYPASS LOGBACK RESTRICTIONS ---
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LOGGING_LEVEL_ROOT
          value: "DEBUG"

  - target:
      kind: HorizontalPodAutoscaler
      name: frontend-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: order-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: user-service-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 1
  - target:
      kind: Ingress
      name: app-ingress
    patch: |-
      - op: replace
        path: /spec/ingressClassName
        value: nginx
      - op: add
        path: /metadata/annotations/nginx.ingress.kubernetes.io~1enable-opentelemetry
        value: "true"
      - op: add
        path: /metadata/annotations/nginx.ingress.kubernetes.io~1opentelemetry-trust-incoming-span
        value: "true"
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: order-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MANAGEMENT_ENDPOINT_HEALTH_VALIDATE_GROUP_MEMBERSHIP
          value: "false"
  - target:
      kind: Deployment
      name: user-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MANAGEMENT_ENDPOINT_HEALTH_VALIDATE_GROUP_MEMBERSHIP
          value: "false"
