grafana:
  # No hardcoded password: admin credentials come from Secret
  # grafana-admin-credentials, created by the ExternalSecret in
  # observability/components/cloud-secrets from AWS Secrets Manager
  # (microservices/<env>/grafana: admin_user, admin_password).
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password
  # Single sign-on through any OIDC provider (Okta, Entra ID, Google,
  # Keycloak, ...). Provider details arrive as GF_* env vars from Secret
  # grafana-oauth (ExternalSecret in observability/components/cloud-secrets,
  # from AWS Secrets Manager microservices/<env>/grafana-oauth). Optional:
  # until that secret exists Grafana starts with SSO off and only the
  # admin login above, which stays as a break-glass account.
  envFromSecrets:
    - name: grafana-oauth
      optional: true
  grafana.ini:
    auth.anonymous:
      enabled: false
    auth.generic_oauth:
      # Turned on by GF_AUTH_GENERIC_OAUTH_ENABLED=true in grafana-oauth.
      enabled: false
      name: SSO
      scopes: openid email profile groups
      use_pkce: true
      allow_sign_up: true
      email_attribute_path: email
      login_attribute_path: preferred_username
      groups_attribute_path: groups
      # The same group names as the Kubernetes RBAC in platform/rbac. With
      # role_attribute_strict, anyone in neither group can't log in.
      role_attribute_path: "contains(groups[*], 'sre') && 'Admin' || contains(groups[*], 'developer-readonly') && 'Viewer'"
      role_attribute_strict: true
  # SSO needs a URL the browser returns to. Internal ALB: reachable from
  # the VPC/VPN only. Each environment sets its host (and so its ACM
  # certificate, which the AWS Load Balancer Controller discovers by host)
  # in addons/values/<env>/kube-prometheus-stack.yaml.
  ingress:
    enabled: true
    ingressClassName: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internal
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
      alb.ingress.kubernetes.io/healthcheck-path: /api/health
    path: /
    pathType: Prefix
  persistence:
    storageClassName: "gp3"
    size: 10Gi

alertmanager:
  alertmanagerSpec:
    # Receiver credentials, mounted at
    # /etc/alertmanager/secrets/alertmanager-receivers/<key>. Created by the
    # ExternalSecret in observability/components/cloud-secrets from AWS
    # Secrets Manager (microservices/<env>/alerting): slack_webhook_url,
    # pagerduty_routing_key, heartbeat_url.
    secrets:
      - alertmanager-receivers
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: slack
      group_by: [alertname, namespace, job]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # Dead man's switch: Watchdog always fires, so the heartbeat
        # service (e.g. a PagerDuty or healthchecks.io check) raises its own
        # alarm when these pings stop, i.e. when alerting itself is broken.
        - matchers: ['alertname="Watchdog"']
          receiver: heartbeat
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 1m
        - matchers: ['alertname="InfoInhibitor"']
          receiver: "null"
        - matchers: ['severity="info"']
          receiver: "null"
        # Critical pages, and is also posted to Slack for context.
        - matchers: ['severity="critical"']
          receiver: pagerduty
          repeat_interval: 1h
          continue: true
        - matchers: ['severity=~"warning|critical"']
          receiver: slack
    inhibit_rules:
      - source_matchers: ['severity="critical"']
        target_matchers: ['severity=~"warning|info"']
        equal: [namespace, alertname]
      - source_matchers: ['severity="warning"']
        target_matchers: ['severity="info"']
        equal: [namespace, alertname]
      - source_matchers: ['alertname="InfoInhibitor"']
        target_matchers: ['severity="info"']
        equal: [namespace]
      # While a service is down its SLO alerts add nothing.
      - source_matchers: ['alertname="ServiceDown"']
        target_matchers: ['alertname=~"SLO.+"']
        equal: [namespace, job]
    receivers:
      - name: "null"
      - name: heartbeat
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-receivers/heartbeat_url
            send_resolved: false
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-receivers/slack_webhook_url
            send_resolved: true
            title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.namespace }})'
            text: |-
              {{ range .Alerts }}*{{ .Annotations.summary }}*
              {{ .Annotations.description }}
              {{ if .Annotations.runbook_url }}Runbook: {{ .Annotations.runbook_url }}{{ end }}
              {{ end }}
      - name: pagerduty
        pagerduty_configs:
          - routing_key_file: /etc/alertmanager/secrets/alertmanager-receivers/pagerduty_routing_key
            send_resolved: true
            description: '{{ .CommonAnnotations.summary }}'
            details:
              runbook: '{{ .CommonAnnotations.runbook_url }}'
              firing: '{{ .Alerts.Firing | len }}'
