kind: ConfigMap
metadata:
  name: kafka-msk
data:
  bootstrap.servers: boot-abc123.c1.kafka-serverless.us-east-1.amazonaws.com:9098
  user-service-role-arn: arn:aws:iam::602367507570:role/microservices-dev-irsa-msk_user_service
