# The services' connections to Kafka (roadmap step 19, apps/base/
# network-policies.yaml): the brokers' TLS listener and the schema registry,
# both in namespace kafka and outside the mesh, so on their own ports.
# Clients reach the brokers one by one after bootstrapping, hence every
# broker pod rather than the bootstrap Service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-clients
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [user-service, order-service, notification-service]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kafka
          podSelector:
            matchLabels:
              strimzi.io/cluster: events
              strimzi.io/broker-role: "true"
      ports:
        - port: 9093
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kafka
          podSelector:
            matchLabels:
              app.kubernetes.io/name: schema-registry
      ports:
        - port: 8080
          protocol: TCP
