# How requests reach the services (roadmap steps 16-17, docs/KONG.md):
# Gateway API routes attached to Kong's Gateway (platform/kong), which sits
# behind the edge (the ALB in the cloud, Traefik in the lab).
#
# The longest matching path wins, whatever the order of rules or routes:
# /api/orders/status before /api/orders before /api, and / last. Plugins
# (konghq.com/plugins) apply to a whole route, so paths that need different
# checks are routes of their own.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend
spec:
  parentRefs:
    - name: kong
      namespace: kong
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
---
# The user API, tasks and the public key (/api/auth/jwks.json) live under
# user-service's /api.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: user-service
spec:
  parentRefs:
    - name: kong
      namespace: kong
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: user-service
          port: 80
---
# Sign-in and sign-up: at most 10 attempts a minute per client address, so
# passwords can't be guessed at speed.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: user-service-auth
  annotations:
    konghq.com/plugins: auth-attempts
spec:
  parentRefs:
    - name: kong
      namespace: kong
      sectionName: http
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/auth/signin
        - path:
            type: Exact
            value: /api/auth/signup
      backendRefs:
        - name: user-service
          port: 80
---
# order-service's open endpoint: the synthetic checks and anyone may ask
# whether it is up, without a token.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: order-service-status
spec:
  parentRefs:
    - name: kong
      namespace: kong
      sectionName: http
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/orders/status
      backendRefs:
        - name: order-service
          port: 80
---
# The order API for the browser: a valid sign-in token is checked at the
# gateway (user-tokens, apps/base/kong.yaml), then again by order-service.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: order-service
  annotations:
    konghq.com/plugins: user-tokens
spec:
  parentRefs:
    - name: kong
      namespace: kong
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/orders
      backendRefs:
        - name: order-service
          port: 80
---
# The partner API, versioned: /api/v1/orders reaches order-service's own
# /api/orders. A partner application identifies itself with its API key
# (partner-keys), which sets its rate-limit tier, and acts for a user whose
# sign-in token order-service checks as usual. A v2 with an incompatible
# API would be a Deployment and Service of its own with a route for
# /api/v2/orders, while v1 clients keep working.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: order-service-partner
  annotations:
    konghq.com/plugins: partner-keys,partner-api-v1
spec:
  parentRefs:
    - name: kong
      namespace: kong
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/orders
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /api/orders
      backendRefs:
        - name: order-service
          port: 80
