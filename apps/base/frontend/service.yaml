apiVersion: v1
kind: Service

metadata:
  name: frontend
  namespace: production

spec:
  # ClusterIP, not LoadBalancer: the Ingress in ingress.yaml is now the single
  # public entrypoint (ALB) for frontend + /api routing to order-service and
  # user-service. A separate LoadBalancer here would give the frontend its
  # own NLB with no path routing, so any same-origin `/api/...` fetch from
  # the browser would hit that NLB directly and never reach a backend.
  type: ClusterIP

  selector:
    app: frontend

  ports:
  - port: 80
    targetPort: 80
