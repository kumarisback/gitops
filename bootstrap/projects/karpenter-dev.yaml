apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: karpenter
    repoURL: oci://public.ecr.aws/karpenter/karpenter
    # Karpenter supports Kubernetes 1.36 from 1.13 (karpenter.sh compatibility
    # matrix). 1.1+ serves only the v1 API, which platform/karpenter/dev uses.
    targetRevision: 1.14.1
    helm:
      values: |
        serviceAccount:
          create: false
          name: karpenter
        settings:
          clusterName: microservices-dev-eks-cluster
          interruptionQueue: microservices-dev-karpenter-interruption
        controller:
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
