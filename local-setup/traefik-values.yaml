# Traefik v3: the KinD lab's ingress controller, replacing ingress-nginx
# (retired upstream in March 2026, no more security fixes). Installed by
# scripts/start-lab.sh. It serves the same Ingress objects the cloud ALB
# does; apps/local only switches ingressClassName to traefik.
deployment:
  replicas: 1

# Bind host ports 80/443 on the control-plane node, which kind-config.yaml
# maps to the Mac's localhost (what the old kind ingress-nginx manifest did).
nodeSelector:
  ingress-ready: "true"
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
ports:
  web:
    hostPort: 80
  websecure:
    hostPort: 443
service:
  spec:
    type: ClusterIP

ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik

# JSON logs and access logs: Alloy ships them, Loki parses them with | json.
log:
  format: json
accessLog:
  enabled: true
  format: json

# A server span per request, sent to the OTel Collector gateway. Traefik
# continues an incoming traceparent (from the browser) and passes its own
# downstream, so traces run browser -> traefik -> services.
tracing:
  serviceName: traefik
  sampleRate: 1.0
  otlp:
    enabled: true
    grpc:
      enabled: true
      endpoint: otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4317
      insecure: true
