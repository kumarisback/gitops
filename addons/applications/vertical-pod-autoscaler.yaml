apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vertical-pod-autoscaler
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: cluster-addons
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - chart: vertical-pod-autoscaler
      repoURL: https://kubernetes.github.io/autoscaler
      targetRevision: 0.13.0
      helm:
        # TIER and ENV are filled in by addons/select-env (see
        # kustomization.yaml); missing files are skipped.
        ignoreMissingValueFiles: true
        valueFiles:
          - $values/addons/values/common/vertical-pod-autoscaler.yaml
          - $values/addons/values/TIER/vertical-pod-autoscaler.yaml
          - $values/addons/values/ENV/vertical-pod-autoscaler.yaml
    - repoURL: https://github.com/kumarisback/gitops.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
