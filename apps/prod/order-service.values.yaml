# order-service in production, deployed with charts/microservice (docs/HELM.md)
# instead of Kustomize. Only what differs from the chart's defaults
# (charts/microservice/values.yaml).
image:
  # The full commit SHA Jenkins tagged the image with; the gitops Jenkins job
  # bumps it by pull request, like the other services' tags in
  # kustomization.yaml.
  tag: "6d9dfdcb454b4596b14a6cc09e19d9fa5ead7e35"
openTelemetry:
  environment: production
# Request payloads in the API log: payloads of failed requests only: enough to debug a failure, without storing customer data for every successful call.
requestLogging:
  requestBody: ERRORS
