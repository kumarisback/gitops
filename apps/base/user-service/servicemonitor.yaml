apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: user-service-monitor
  namespace: production
  labels:
    # Matches the kube-prometheus-stack release. Prometheus here selects every
    # ServiceMonitor (serviceMonitorSelectorNilUsesHelmValues: false), so this
    # only matters if that setting is ever turned back on.
    release: kube-prometheus-stack
spec:
  # Matches labels on the user-service Service object (see service.yaml).
  selector:
    matchLabels:
      app: user-service
  endpoints:
  # Actuator's own port (management.server.port), outside the context path.
  - port: management
    path: /actuator/prometheus
    interval: 15s
